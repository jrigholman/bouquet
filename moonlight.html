<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowers from Jon</title>
<meta name="theme-color" content="#0d0820">
<meta property="og:title" content="Flowers from Jon">
<meta property="og:type" content="website">
<meta property="og:url" content="https://flowers.wcomops.com/moonlight.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Flowers from Jon">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0820; }
  canvas { position: fixed; inset: 0; display: block; }
  #sky { z-index: 0; }
  #fx { z-index: 1; }

  .film-btn {
    position: fixed;
    bottom: 1.1rem;
    font-size: 1.7rem;
    line-height: 1;
    color: rgba(255, 228, 195, 0.7);
    text-decoration: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease, color 0.3s ease;
    z-index: 3;
    cursor: pointer;
    user-select: none;
  }
  .film-btn.show { opacity: 1; pointer-events: auto; }
  .film-btn:hover { color: rgba(255, 240, 215, 1); }
  #film-replay { right: 1.3rem; }
  #film-home { left: 1.3rem; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>
<div id="film-replay" class="film-btn" role="button" aria-label="replay">&#8635;</div>
<a id="film-home" class="film-btn" aria-label="interactive bouquet">&#128144;</a>

<script>
(function () {
  "use strict";

  // ----- personalization: ?name=Sofia -----
  const params = new URLSearchParams(location.search);
  const NAME = (params.get("name") || "Mary").slice(0, 24);
  document.title = "A Bouquet for " + NAME;

  const fxCanvas = document.getElementById("fx");
  const ctx = fxCanvas.getContext("2d");
  const skyCanvas = document.getElementById("sky");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const GOLDEN = 2.399963;

  let W = 0, H = 0, DPR = 1;
  let NX = 0, NY = 0;
  let WL = 0;
  let HEADX = 0, HEADY = 0;
  let movieT = 0;
  let nameSprite = null;
  let flower = null;
  let stemPts = [], stemLen = 0;
  let iconsShown = false;

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (v) => v * v * (3 - 2 * v);
  const hsl = (h, s, l, a = 1) => `hsla(${h.toFixed(1)},${s.toFixed(1)}%,${l.toFixed(1)}%,${a})`;

  const pollen = [];
  const airPetals = [];
  const waterPetals = [];
  const ripples = [];
  const fireflies = [];
  const leaves = [];
  const grassBlades = [];
  const cattails = [];
  const mists = [];
  let shootingStar = null;
  let nextShooting = 9;
  let nextShed = 20;

  // fine monochrome noise, reused for petal texture and film grain
  const grainTex = (() => {
    const c = document.createElement("canvas");
    c.width = c.height = 96;
    const g = c.getContext("2d");
    const img = g.createImageData(96, 96);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 128 + ((Math.random() * 90 - 45) | 0);
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c;
  })();
  let grainPattern = null;

  // ---------------------------------------------------------------
  // Film timeline (~30s)
  //   0–2.5 fade in under stars · 1.5–7 the moon rises over the lake
  //   6.5–10.5 the stem climbs from the corner · 10.5–17.5 the marigold
  //   opens petal ring by petal ring · 17+ golden pollen drifts skyward
  //   23.5–27.5 the name glows into the night · then a living hold
  // ---------------------------------------------------------------
  const moonRise = () => reducedMotion ? 1 : smooth(clamp((movieT - 1.5) / 5.5, 0, 1));
  const stemProgress = () => reducedMotion ? 1 : smooth(clamp((movieT - 6.5) / 4.0, 0, 1));
  const bloomAmount = () => reducedMotion ? 1 : smooth(clamp((movieT - 10.5) / 7.0, 0, 1));
  const nameAlpha = () => reducedMotion ? 1 : smooth(clamp((movieT - 23.5) / 4.0, 0, 1));

  // ---------------------------------------------------------------
  // Ray-traced sky & water (WebGL). Every water pixel casts a ray,
  // reflects it off animated wave normals with fresnel falloff, and
  // samples the same sky the eye sees — so the moon, hills, and the
  // name's golden light truly mirror in the lake.
  // ---------------------------------------------------------------
  let gl = null, glProg = null, glUniforms = {};

  const VSRC = `
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

  const FSRC = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uRes;
uniform float uT;
uniform float uMoon;      // 0 below the hills .. 1 fully risen
uniform float uName;      // the name's light
uniform vec2 uNameNdc;
uniform float uFlower;    // warm light of the bloom
uniform vec2 uFlowerNdc;
uniform vec3 uFlowerPos;  // the marigold head, as real geometry
uniform float uFlowerR;
uniform float uBloom;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
             mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }
  return v;
}

vec3 rayDir(vec2 ndc) {
  float aspect = uRes.x / uRes.y;
  return normalize(vec3(ndc.x * aspect * 0.9, (ndc.y + 0.28) * 0.9, -2.0));
}

vec3 moonDir() {
  float el = mix(-0.10, 0.42, uMoon);
  float az = -0.50;
  return normalize(vec3(sin(az) * cos(el), sin(el), -cos(az) * cos(el)));
}

// ---- the marigold: a ray-marched bloom of ringed, creased petals ----
vec3 flowerAxis() { return normalize(vec3(-0.28, 0.30, 0.92)); }

float petalField(vec3 n) {
  vec3 A = flowerAxis();
  float ang = acos(clamp(dot(n, A), -1.0, 1.0));
  vec3 u = normalize(cross(A, vec3(0.0, 1.0, 0.0)));
  vec3 v = cross(A, u);
  float az = atan(dot(n, v), dot(n, u));
  float ring = ang * 6.4 + 0.35;      // concentric petal rows
  float row = floor(ring);
  float fr = fract(ring);
  float az2 = az * 1.90986 + row * 0.5; // twelve petals a row, rows offset
  float c = abs(fract(az2) - 0.5) * 2.0; // 0 petal centre .. 1 crease
  float cup = sin(fr * 3.14159);
  return cup * (1.0 - 0.32 * c * c) - 0.35 * pow(c, 6.0) * cup;
}

float flowerSDF(vec3 p) {
  vec3 q = p - uFlowerPos;
  q += flowerAxis() * dot(q, flowerAxis()) * 0.22; // a gently flattened bloom, not a ball
  float r = length(q);
  vec3 n = q / max(r, 1e-5);
  float R = uFlowerR * (0.30 + 0.70 * uBloom);
  return (r - R * (0.84 + 0.16 * petalField(n))) * 0.6;
}

vec3 flowerNormal(vec3 p) {
  float e = uFlowerR * 0.015;
  return normalize(vec3(
    flowerSDF(p + vec3(e, 0, 0)) - flowerSDF(p - vec3(e, 0, 0)),
    flowerSDF(p + vec3(0, e, 0)) - flowerSDF(p - vec3(0, e, 0)),
    flowerSDF(p + vec3(0, 0, e)) - flowerSDF(p - vec3(0, 0, e))));
}

vec2 sphereHit(vec3 ro, vec3 rd, vec3 c, float R) {
  vec3 oc = ro - c;
  float b = dot(oc, rd);
  float h = b * b - (dot(oc, oc) - R * R);
  if (h < 0.0) return vec2(-1.0);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

// ---- the lake: classic choppy sea octaves, tuned down to calm ----
float seaOctave(vec2 uv, float choppy) {
  uv += noise(uv);
  vec2 wv = 1.0 - abs(sin(uv));
  vec2 swv = abs(cos(uv));
  wv = mix(wv, swv, wv);
  return pow(1.0 - pow(wv.x * wv.y, 0.65), choppy);
}

float seaHeight(vec2 p) {
  float freq = 0.30, amp = 0.42, choppy = 3.2;
  vec2 uv = p;
  uv.x *= 0.75;
  float h = 0.0;
  for (int i = 0; i < 4; i++) {
    float d = seaOctave((uv + uT * 0.55) * freq, choppy);
    d += seaOctave((uv - uT * 0.45) * freq, choppy);
    h += d * amp;
    uv = mat2(1.6, 1.2, -1.2, 1.6) * uv;
    freq *= 1.9;
    amp *= 0.22;
    choppy = mix(choppy, 1.0, 0.2);
  }
  return h * 0.55;
}

float seaHeightCheap(vec2 p) { // 2 octaves — used only while marching
  float freq = 0.30, amp = 0.42, choppy = 3.2;
  vec2 uv = p;
  uv.x *= 0.75;
  float h = 0.0;
  for (int i = 0; i < 2; i++) {
    h += seaOctave((uv + uT * 0.55) * freq, choppy) * amp;
    uv = mat2(1.6, 1.2, -1.2, 1.6) * uv;
    freq *= 1.9;
    amp *= 0.22;
  }
  return h * 0.55;
}

#define WAVE_AMP 0.34
float mapWater(vec3 p) { return p.y - seaHeightCheap(p.xz * 0.9) * WAVE_AMP; }

// heightmap tracing: march the ray against the wave field so near
// waves have real crests and parallax, not a flat plane
float traceWater(vec3 ro, vec3 rd) {
  float tm = 0.0;
  float tx = min(ro.y / max(-rd.y, 0.004) * 3.0, 400.0);
  float hx = mapWater(ro + rd * tx);
  if (hx > 0.0) return tx;
  float hm = mapWater(ro);
  float tmid = tx;
  for (int i = 0; i < 8; i++) {
    tmid = mix(tm, tx, hm / (hm - hx));
    vec3 p = ro + rd * tmid;
    float hmid = mapWater(p);
    if (hmid < 0.0) { tx = tmid; hx = hmid; }
    else { tm = tmid; hm = hmid; }
  }
  return tmid;
}

vec3 seaNormal(vec2 p, float t) {
  float eps = 0.012 + t * 0.005;  // farther water samples wider
  float h = seaHeight(p);
  return normalize(vec3(
    h - seaHeight(p + vec2(eps, 0.0)),
    eps * (0.9 + t * 0.05) / WAVE_AMP * 0.55, // and flattens with distance
    h - seaHeight(p + vec2(0.0, eps))
  ));
}

// ---- the night sky ----
vec3 skyBase(vec3 rd) {
  float y = max(rd.y, 0.0);
  vec3 col = mix(vec3(0.088, 0.062, 0.150), vec3(0.030, 0.024, 0.070), 1.0 - exp(-y * 2.6));
  col += vec3(0.155, 0.085, 0.105) * exp(-y * 7.5);   // warm haze at the horizon
  return col;
}

vec3 skyColor(vec3 rd, float starAmt) {
  vec3 col = skyBase(rd);
  vec3 md = moonDir();
  float lum = 0.30 + 0.70 * uMoon;
  float d = max(dot(rd, md), 0.0);

  // atmospheric glow: a tight forward lobe and a broad wash
  col += vec3(0.92, 0.83, 0.66) * pow(d, 180.0) * 0.30 * lum;
  col += vec3(0.62, 0.52, 0.47) * pow(d, 10.0) * 0.16 * lum;

  // a faint light pillar standing in the low haze under the moon
  float azd = atan(rd.x, -rd.z) - atan(md.x, -md.z);
  col += vec3(0.85, 0.72, 0.55) * exp(-azd * azd * 90.0) * exp(-max(rd.y, 0.0) * 10.0) * 0.10 * uMoon;

  // the Milky Way: a tilted band of glow, dust lanes, and dense dim stars
  float cmask = 0.0;
  vec2 gae = vec2(atan(rd.x, -rd.z), rd.y);
  if (rd.y > 0.02 && starAmt > 0.0) {
    float band = gae.y - (0.46 + 0.20 * gae.x);
    float bw = exp(-band * band * 16.0);
    if (bw > 0.01) {
      float dens = fbm(vec2(gae.x * 3.2, band * 9.0) + 3.7);
      float dust = fbm(vec2(gae.x * 5.5, band * 16.0) + 9.1);
      vec3 mw = (vec3(0.13, 0.12, 0.17) * dens + vec3(0.05, 0.045, 0.07))
        * (1.0 - smoothstep(0.42, 0.72, dust) * 0.8);
      col += mw * bw * 0.85 * starAmt;
      float ms = hash(floor(vec2(gae.x, gae.y) * 420.0));
      col += vec3(0.75, 0.78, 0.92) * step(0.992, ms) * bw * 0.22 * starAmt;
    }
  }

  // stars: a faint field, a few bright ones with diffraction spikes
  if (rd.y > 0.015 && starAmt > 0.0) {
    vec2 sc = vec2(gae.x * 2.6, gae.y * 5.0) * 42.0;
    vec2 cell = floor(sc);
    vec2 f = fract(sc) - 0.5;
    float h1 = hash(cell);
    if (h1 > 0.905) {
      float mag = pow((h1 - 0.905) / 0.095, 3.0);
      float tw = 0.55 + 0.45 * sin(uT * (0.6 + h1 * 3.0) + h1 * 40.0);
      float star = smoothstep(0.20, 0.02, length(f)) * mag * tw;
      vec3 stint = mix(vec3(0.75, 0.82, 1.0), vec3(1.0, 0.90, 0.72), hash(cell + 7.7));
      col += stint * star * 1.6 * starAmt;
      if (h1 > 0.986) { // the brightest catch a four-point cross
        float spikes = (exp(-abs(f.x) * 26.0) + exp(-abs(f.y) * 26.0))
          * exp(-length(f) * 5.0) * mag * tw;
        col += stint * spikes * 0.8 * starAmt;
      }
    }
  }

  // cloud wisps on the dome, lit from the moon's side
  float hproj = 1.0 / (rd.y + 0.18);
  vec2 cuv = rd.xz * hproj * 0.55 + vec2(uT * 0.005, 0.0);
  float cl = fbm(cuv * 1.4) * 0.6 + fbm(cuv * 3.4 + 4.7) * 0.4;
  cmask = smoothstep(0.52, 0.80, cl) * smoothstep(0.0, 0.16, rd.y) * 0.55;
  vec3 ccol = mix(vec3(0.055, 0.045, 0.095), vec3(0.38, 0.34, 0.36), (0.15 + 0.85 * pow(d, 4.0)) * lum);
  col = mix(col, ccol, cmask);

  // the moon: limb darkening, two-scale maria, bright crater flecks,
  // and atmospheric reddening while it sits low over the hills
  float ang = acos(clamp(dot(rd, md), -1.0, 1.0));
  float aR = 0.031;
  float disc = 1.0 - smoothstep(aR * 0.97, aR * 1.03, ang);
  if (disc > 0.0) {
    float q = clamp(ang / aR, 0.0, 1.0);
    float limb = sqrt(max(0.0, 1.0 - q * q)) * 0.38 + 0.62;
    vec2 muv = vec2(gae.x, gae.y) * 30.0;
    float m1 = fbm(muv + fbm(muv * 1.7) * 1.5);
    float m2 = fbm(muv * 2.8 + 4.3);
    float mar = smoothstep(0.44, 0.70, m1) * 0.26 + smoothstep(0.55, 0.80, m2) * 0.10;
    float fleck = smoothstep(0.90, 0.99, noise(muv * 3.4 + 8.8)) * 0.18; // young craters
    vec3 mcol = vec3(1.12, 1.07, 0.95) * limb * (1.0 - mar) + vec3(fleck);
    float lowRed = exp(-max(md.y, 0.0) * 7.0); // reddened near the horizon
    mcol *= mix(vec3(1.0), vec3(1.0, 0.62, 0.42), lowRed * 0.75);
    mcol *= (0.55 + 0.45 * uMoon);
    col = mix(col, mcol, disc * (1.0 - cmask * 0.5));
  }

  // the name's golden light and the bloom's warmth live in this sky
  vec3 nd = rayDir(uNameNdc);
  float dn = max(dot(rd, nd), 0.0);
  col += vec3(1.00, 0.76, 0.38) * pow(dn, 700.0) * 1.0 * uName;
  col += vec3(1.00, 0.72, 0.36) * pow(dn, 60.0) * 0.20 * uName;
  vec3 fd = rayDir(uFlowerNdc);
  float df = max(dot(rd, fd), 0.0);
  col += vec3(1.00, 0.55, 0.18) * pow(df, 500.0) * 0.45 * uFlower;
  col += vec3(1.00, 0.55, 0.20) * pow(df, 70.0) * 0.09 * uFlower;

  // two ridges of hills, fading into the haze
  if (rd.y >= 0.0) {
    float az = atan(rd.x, -rd.z);
    float hA = 0.014 + 0.018 * sin(az * 1.9 + 1.7) + 0.011 * sin(az * 4.3 + 0.6) + 0.005 * sin(az * 9.3);
    float hillA = 1.0 - smoothstep(hA - 0.0035, hA + 0.0035, rd.y);
    vec3 colA = mix(vec3(0.055, 0.038, 0.098), skyBase(rd) * 1.15, 0.45);
    col = mix(col, colA, hillA);
    float hB = 0.006 + 0.010 * sin(az * 2.7 + 4.1) + 0.006 * sin(az * 6.1 + 2.2);
    float hillB = 1.0 - smoothstep(hB - 0.003, hB + 0.003, rd.y);
    col = mix(col, vec3(0.038, 0.026, 0.070), hillB);
  }
  return col;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 ndc = uv * 2.0 - 1.0;
  vec3 rd = rayDir(ndc);
  vec3 ro = vec3(0.0, 1.6, 0.0);
  vec3 md = moonDir();
  float lum = 0.30 + 0.70 * uMoon;
  vec3 col;

  // the marigold first: real geometry in the same light as the water
  bool hitFlower = false;
  if (uBloom > 0.03) {
    vec2 bs = sphereHit(ro, rd, uFlowerPos, uFlowerR * 1.05);
    if (bs.y > 0.0) {
      float tf = max(bs.x, 0.0);
      for (int i = 0; i < 40; i++) {
        vec3 p = ro + rd * tf;
        float d = flowerSDF(p);
        if (d < uFlowerR * 0.004) { hitFlower = true; break; }
        tf += max(d, uFlowerR * 0.002);
        if (tf > bs.y) break;
      }
      if (hitFlower) {
        vec3 p = ro + rd * tf;
        vec3 N = flowerNormal(p);
        vec3 nq = normalize(p - uFlowerPos);
        float fld = petalField(nq);
        float occ = clamp(0.45 + 0.55 * fld, 0.0, 1.0);
        float ang = acos(clamp(dot(nq, flowerAxis()), -1.0, 1.0));
        vec3 albedo = mix(vec3(0.70, 0.20, 0.03), vec3(1.30, 0.66, 0.12), clamp(fld, 0.0, 1.0));
        albedo = mix(albedo, vec3(1.35, 0.85, 0.22), smoothstep(0.9, 1.6, ang) * 0.5);
        albedo = mix(vec3(0.15, 0.30, 0.08), albedo, smoothstep(0.12, 0.5, uBloom)); // green as a bud
        if (ang < 0.22) { // the floret eye
          float sp = noise(nq.xy * 90.0);
          albedo = mix(vec3(0.45, 0.14, 0.03), vec3(1.0, 0.55, 0.10), smoothstep(0.55, 0.95, sp));
          occ = 0.9;
        }
        float diff = max(dot(N, md), 0.0);
        float back = pow(max(dot(rd, md), 0.0), 2.0) * (1.0 - occ) * 0.9; // petal translucency
        float spec = pow(max(dot(reflect(rd, N), md), 0.0), 28.0) * 0.30;
        vec3 skyAmb = vec3(0.26, 0.20, 0.34);
        vec3 moonCol = vec3(1.0, 0.93, 0.80) * lum;
        col = albedo * (skyAmb * (0.45 + 0.25 * N.y) + moonCol * diff * 1.15 + vec3(1.0, 0.55, 0.25) * back)
            + moonCol * spec;
        // the name's gold kisses the near petals
        vec3 npos = vec3(0.0, 1.6, 0.0) + rayDir(uNameNdc) * 12.0;
        col += vec3(1.0, 0.72, 0.35) * max(dot(N, normalize(npos - p)), 0.0) * 0.30 * uName;
        col *= (0.62 + 0.38 * occ);
      }
    }
  }

  if (!hitFlower) if (rd.y < -0.004) {
    // march the ray against the wave field — real crests, real parallax
    float t = traceWater(ro, rd);
    vec3 pos = ro + rd * t;
    vec3 n = seaNormal(pos.xz * 0.9, t);
    vec3 rr = reflect(rd, n);
    rr.y = abs(rr.y) + 0.012;
    rr = normalize(rr);
    vec3 refl = skyColor(rr, 0.12) * 0.88;
    float fres = 0.02 + 0.98 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
    vec3 deep = vec3(0.016, 0.020, 0.038);
    col = mix(deep, refl, clamp(fres * 1.35, 0.0, 1.0));

    // the moonlight pillar: specular whose roughness grows with distance
    vec3 hv = normalize(md - rd);
    float shin = mix(750.0, 150.0, clamp(t / 90.0, 0.0, 1.0));
    float spec = pow(max(dot(n, hv), 0.0), shin);
    col += vec3(1.0, 0.90, 0.70) * spec * 0.60 * lum;
    // sparkle glints riding the pillar
    float glit = smoothstep(0.965, 1.0, noise(pos.xz * 6.0 + vec2(uT * 1.7, -uT * 1.2)));
    col += vec3(1.0, 0.93, 0.75) * glit * spec * 4.5 * lum;

    float fog = 1.0 - exp(-t * 0.016);
    col = mix(col, skyBase(vec3(rd.x, 0.001, rd.z)) * 1.05, fog * 0.85);
  } else {
    col = skyColor(rd, 1.0);
  }

  // filmic finish: exposure rides the moonrise, ACES, fine dither
  col *= 1.05 + 0.55 * uMoon;
  col = clamp((col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14), 0.0, 1.0);
  col = pow(col, vec3(0.96));
  col += (hash(gl_FragCoord.xy + fract(uT) * 61.7) - 0.5) / 150.0;
  gl_FragColor = vec4(col, 1.0);
}
`;

  function initGL() {
    const opts = { antialias: false, depth: false, alpha: false };
    gl = skyCanvas.getContext("webgl", opts) || skyCanvas.getContext("experimental-webgl", opts);
    if (!gl) return false;
    function sh(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.warn("moonlight shader:", gl.getShaderInfoLog(s));
        gl = null;
        return null;
      }
      return s;
    }
    const vs = sh(gl.VERTEX_SHADER, VSRC);
    if (!vs) return false;
    const fs = sh(gl.FRAGMENT_SHADER, FSRC);
    if (!fs) return false;
    glProg = gl.createProgram();
    gl.attachShader(glProg, vs);
    gl.attachShader(glProg, fs);
    gl.linkProgram(glProg);
    if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) {
      console.warn("moonlight shader link:", gl.getProgramInfoLog(glProg));
      gl = null;
      return false;
    }
    gl.useProgram(glProg);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(glProg, "aPos");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    for (const u of ["uRes", "uT", "uMoon", "uName", "uNameNdc", "uFlower", "uFlowerNdc", "uFlowerPos", "uFlowerR", "uBloom"]) {
      glUniforms[u] = gl.getUniformLocation(glProg, u);
    }
    return true;
  }

  const ndcOf = (x, y) => [(x / W) * 2 - 1, 1 - (y / H) * 2];

  // invert the shader camera: the world point that projects to (x, y)
  function worldFromScreen(x, y, dist) {
    const dx = ((x / W) * 2 - 1) * (W / H) * 0.9;
    const dy = ((1 - (y / H) * 2) + 0.28) * 0.9;
    const dz = -2.0;
    const L = Math.hypot(dx, dy, dz);
    return [dx / L * dist, 1.6 + dy / L * dist, dz / L * dist];
  }

  function drawShaderBackground(t) {
    gl.viewport(0, 0, skyCanvas.width, skyCanvas.height);
    gl.uniform2f(glUniforms.uRes, skyCanvas.width, skyCanvas.height);
    gl.uniform1f(glUniforms.uT, reducedMotion ? 0 : t);
    gl.uniform1f(glUniforms.uMoon, moonRise());
    gl.uniform1f(glUniforms.uName, nameAlpha());
    const nn = ndcOf(NX, NY);
    gl.uniform2f(glUniforms.uNameNdc, nn[0], nn[1]);
    gl.uniform1f(glUniforms.uFlower, bloomAmount() * 0.8);
    const fn = ndcOf(HEADX, HEADY);
    gl.uniform2f(glUniforms.uFlowerNdc, fn[0], fn[1]);
    const sway = reducedMotion ? 0 : Math.sin(t * 0.5) * 2.5;
    const fw = worldFromScreen(HEADX + sway, HEADY, 7.0);
    gl.uniform3f(glUniforms.uFlowerPos, fw[0], fw[1], fw[2]);
    gl.uniform1f(glUniforms.uFlowerR, 7.0 * 0.9 * flower.size / H);
    gl.uniform1f(glUniforms.uBloom, bloomAmount());
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // Painted fallback for devices without WebGL — same scene, same film,
  // rendered with gradients instead of rays
  const fbStars = [], fbClouds = [], fbGlints = [];

  function seedFallback() {
    fbStars.length = 0;
    const n = Math.round((W * H) / 9000);
    for (let i = 0; i < n; i++) {
      fbStars.push({
        x: rand(0, W), y: rand(0, WL * 0.96),
        r: rand(0.4, 1.7), tw: rand(0.4, 2.2), ph: rand(0, TAU),
        warm: Math.random() < 0.2,
      });
    }
    fbClouds.length = 0;
    for (let i = 0; i < 3; i++) {
      fbClouds.push({
        x: rand(0, W), y: rand(H * 0.06, H * 0.4),
        w: rand(W * 0.25, W * 0.45), h: rand(30, 60),
        v: rand(2, 6) * (Math.random() < 0.5 ? -1 : 1),
        a: rand(0.03, 0.06),
      });
    }
    fbGlints.length = 0;
    for (let i = 0; i < 46; i++) {
      fbGlints.push({
        y: rand(WL + 6, H - 8),
        ph: rand(0, TAU), sp: rand(0.6, 1.8),
        len: rand(6, 26),
      });
    }
  }

  function drawFallbackBackground(dt, t) {
    const rise = moonRise();
    let g = ctx.createLinearGradient(0, 0, 0, WL);
    g.addColorStop(0, "#130c2b");
    g.addColorStop(0.55, "#241543");
    g.addColorStop(0.88, "#3a2050");
    g.addColorStop(1, "#4b2a56");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, WL);

    for (const s of fbStars) {
      const a = (0.25 + 0.75 * Math.pow((Math.sin(t * s.tw + s.ph) + 1) / 2, 2)) * (0.5 + 0.5 * rise);
      ctx.fillStyle = s.warm ? `rgba(255,226,180,${a * 0.9})` : `rgba(235,240,255,${a * 0.8})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }

    for (const c of fbClouds) {
      c.x += c.v * dt * (reducedMotion ? 0 : 1);
      if (c.x < -c.w) c.x = W + c.w * 0.5;
      if (c.x > W + c.w) c.x = -c.w * 0.5;
      const g2 = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.w / 2);
      g2.addColorStop(0, `rgba(200,170,220,${c.a})`);
      g2.addColorStop(1, "rgba(200,170,220,0)");
      ctx.fillStyle = g2;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(1, c.h / (c.w / 2));
      ctx.translate(-c.x, -c.y);
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.w / 2, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    // the moon rises out of the hills, reddened low, silver high
    const mx = W * 0.14;
    const my = WL + H * 0.02 - (H * 0.44) * rise;
    const mr = clamp(Math.min(W, H) * 0.062, 24, 58);
    const warm = 1 - rise;
    g = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 4.2);
    g.addColorStop(0, `rgba(250,240,215,${0.14 + 0.18 * rise})`);
    g.addColorStop(0.35, "rgba(240,220,200,0.10)");
    g.addColorStop(1, "rgba(240,220,200,0)");
    ctx.fillStyle = g;
    ctx.fillRect(mx - mr * 4.2, my - mr * 4.2, mr * 8.4, mr * 8.4);
    g = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
    g.addColorStop(0, `rgb(${251 - warm * 6},${246 - warm * 60},${230 - warm * 110})`);
    g.addColorStop(0.85, `rgb(${239 - warm * 8},${226 - warm * 66},${200 - warm * 100})`);
    g.addColorStop(1, `rgb(${226 - warm * 10},${208 - warm * 62},${178 - warm * 90})`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "rgba(190,170,150,0.25)";
    for (const [dx, dy, r] of [[-0.3, 0.1, 0.16], [0.25, -0.22, 0.11], [0.1, 0.32, 0.09], [-0.05, -0.1, 0.07]]) {
      ctx.beginPath();
      ctx.arc(mx + dx * mr, my + dy * mr, r * mr, 0, TAU);
      ctx.fill();
    }

    // hills over the moonrise, then the water
    ctx.fillStyle = "#251536";
    ctx.beginPath();
    ctx.moveTo(0, WL);
    ctx.quadraticCurveTo(W * 0.12, WL - H * 0.055, W * 0.28, WL - H * 0.012);
    ctx.quadraticCurveTo(W * 0.42, WL + 2, W * 0.58, WL - H * 0.03);
    ctx.quadraticCurveTo(W * 0.72, WL - H * 0.055, W, WL - H * 0.008);
    ctx.lineTo(W, WL);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#1c0f2b";
    ctx.beginPath();
    ctx.moveTo(0, WL);
    ctx.quadraticCurveTo(W * 0.10, WL - H * 0.028, W * 0.24, WL - H * 0.004);
    ctx.quadraticCurveTo(W * 0.5, WL + 4, W * 0.8, WL - H * 0.014);
    ctx.quadraticCurveTo(W * 0.92, WL - H * 0.02, W, WL - H * 0.002);
    ctx.lineTo(W, WL);
    ctx.closePath();
    ctx.fill();

    g = ctx.createLinearGradient(0, WL, 0, H);
    g.addColorStop(0, "#3d2450");
    g.addColorStop(0.25, "#291940");
    g.addColorStop(1, "#120b24");
    ctx.fillStyle = g;
    ctx.fillRect(0, WL, W, H - WL);
    ctx.fillStyle = "rgba(255,220,190,0.12)";
    ctx.fillRect(0, WL, W, 1.5);

    // moon glitter path
    for (const gl2 of fbGlints) {
      const depth = (gl2.y - WL) / (H - WL);
      const spread = 14 + depth * mr * 2.6;
      const a = (0.10 + 0.5 * Math.pow((Math.sin(t * gl2.sp + gl2.ph) + 1) / 2, 3)) * (1 - depth * 0.55) * rise;
      const wob = Math.sin(t * 0.9 + gl2.ph * 3) * spread * 0.4;
      ctx.strokeStyle = `rgba(250,235,205,${a})`;
      ctx.lineWidth = 1.1 + depth;
      ctx.beginPath();
      ctx.moveTo(mx + wob - gl2.len / 2, gl2.y);
      ctx.lineTo(mx + wob + gl2.len / 2, gl2.y);
      ctx.stroke();
    }

    // warm shimmer where the name and the bloom light the water
    const nA = nameAlpha();
    if (nA > 0) {
      g = ctx.createRadialGradient(NX, WL + 30, 0, NX, WL + 30, W * 0.2);
      g.addColorStop(0, `rgba(255,190,110,${0.10 * nA})`);
      g.addColorStop(1, "rgba(255,190,110,0)");
      ctx.save();
      ctx.translate(NX, WL + 30);
      ctx.scale(1, 0.35);
      ctx.translate(-NX, -(WL + 30));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(NX, WL + 30, W * 0.2, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------
  // The name — kept from the bouquet pages
  // ---------------------------------------------------------------
  function renderName() {
    const fontSize = clamp(W * 0.105, 44, 138);
    const font = `italic bold ${fontSize}px Georgia, "Palatino Linotype", serif`;
    ctx.font = font;
    const textW = ctx.measureText(NAME).width;
    const pad = fontSize * 0.6;
    const c = document.createElement("canvas");
    const lw = textW + pad * 2;
    const lh = fontSize * 1.35 + pad * 2;
    c.width = Math.ceil(lw * DPR);
    c.height = Math.ceil(lh * DPR);
    const g = c.getContext("2d");
    g.scale(DPR, DPR);
    g.textAlign = "center";
    g.textBaseline = "middle";
    const nx = lw / 2, ny = pad + fontSize * 0.62;
    g.font = font;
    g.shadowColor = "rgba(255,170,90,0.85)";
    g.shadowBlur = fontSize * 0.28;
    g.fillStyle = "rgba(255,214,150,0.9)";
    g.fillText(NAME, nx, ny);
    g.shadowBlur = fontSize * 0.10;
    g.fillText(NAME, nx, ny);
    g.shadowBlur = 0;
    const grad = g.createLinearGradient(0, ny - fontSize * 0.55, 0, ny + fontSize * 0.55);
    grad.addColorStop(0, "#fffbe9");
    grad.addColorStop(0.35, "#ffe9b0");
    grad.addColorStop(0.62, "#ffcb72");
    grad.addColorStop(1, "#e08a3c");
    g.fillStyle = grad;
    g.fillText(NAME, nx, ny);
    nameSprite = { canvas: c, w: lw, h: lh, ox: nx, oy: ny };
  }

  function drawName(t) {
    const a = nameAlpha();
    if (!nameSprite || a <= 0) return;
    const s = nameSprite;
    const pulse = reducedMotion ? 0 : (Math.sin(t * 1.1) + 1) / 2;
    ctx.save();
    ctx.translate(NX, NY);
    ctx.scale(1 + pulse * 0.01, 1 + pulse * 0.01);
    ctx.globalAlpha = a;
    ctx.drawImage(s.canvas, -s.ox, -s.oy, s.w, s.h);
    if (pulse > 0) {
      ctx.globalAlpha = a * pulse * 0.25;
      ctx.globalCompositeOperation = "lighter";
      ctx.drawImage(s.canvas, -s.ox, -s.oy, s.w, s.h);
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------
  // The marigold — three-quarter view on its tall foreground stem
  // ---------------------------------------------------------------
  function marigoldPetalPath(g, L, w) {
    const r0 = L * 0.10;
    g.beginPath();
    g.moveTo(r0, 0);
    g.bezierCurveTo(L * 0.30, -w * 0.9, L * 0.62, -w, L * 0.80, -w * 0.70);
    g.quadraticCurveTo(L * 1.03, -w * 0.48, L * 0.93, -w * 0.22);
    g.quadraticCurveTo(L * 1.07, 0, L * 0.93, w * 0.22);
    g.quadraticCurveTo(L * 1.03, w * 0.48, L * 0.80, w * 0.70);
    g.bezierCurveTo(L * 0.62, w, L * 0.30, w * 0.9, r0, 0);
    g.closePath();
  }

  function makeSprite(size) {
    const logical = size * 2.6;
    const c = document.createElement("canvas");
    c.width = c.height = Math.max(8, Math.ceil(logical * 3)); // crisp close-up
    const g = c.getContext("2d");
    g.scale(3, 3);
    g.translate(logical / 2, logical / 2);
    return { canvas: c, logical, g };
  }

  function buildMarigold(size) {
    const h = 28 + rand(-4, 4);
    const layers = [];
    const nLayers = 6;
    for (let li = 0; li < nLayers; li++) {
      const f = li / (nLayers - 1);
      const R = size * (1 - li * 0.15);
      const sp = makeSprite(R);
      const g = sp.g;
      g.shadowColor = "rgba(40,10,30,0.55)";
      g.shadowBlur = R * 0.16;
      g.shadowOffsetY = R * 0.10;
      const count = Math.max(11, Math.round(18 - li * 1.6));
      for (let i = 0; i < count; i++) {
        const a = (i / count) * TAU + li * 0.42 + rand(-0.05, 0.05);
        const L = R * rand(0.92, 1.08);
        const w = R * 0.32 * rand(0.88, 1.1);
        const jh = rand(-2.5, 2.5), jl = rand(-4, 4);
        g.save();
        g.rotate(a);
        marigoldPetalPath(g, L, w);
        const grad = g.createLinearGradient(0, 0, L, 0);
        grad.addColorStop(0, hsl(h - 14 + f * 6 + jh, 88, 30 + f * 9 + jl * 0.6));
        grad.addColorStop(0.55, hsl(h + f * 16 + jh, 96, 50 + f * 12 + jl));
        grad.addColorStop(1, hsl(h + f * 12 + jh, 90, 44 + f * 11 + jl));
        g.fillStyle = grad;
        g.fill();
        g.strokeStyle = hsl(h + 18, 95, 74, 0.3);
        g.lineWidth = 0.8;
        g.stroke();
        // satin sheen across the petal's belly
        g.clip();
        const shg = g.createLinearGradient(0, -w, L * 0.9, w);
        shg.addColorStop(0.35, "rgba(255,240,210,0)");
        shg.addColorStop(0.55, "rgba(255,240,210,0.15)");
        shg.addColorStop(0.75, "rgba(255,240,210,0)");
        g.fillStyle = shg;
        g.fillRect(0, -w * 1.2, L * 1.1, w * 2.4);
        g.restore();
      }
      g.save();
      g.globalCompositeOperation = "source-atop";
      // moonlit side: warm backlit translucency; far side falls to shadow
      let sg = g.createRadialGradient(-R * 0.55, -R * 0.35, 0, -R * 0.55, -R * 0.35, R * 1.8);
      sg.addColorStop(0, "rgba(255,236,196,0.28)");
      sg.addColorStop(1, "rgba(255,236,196,0)");
      g.fillStyle = sg;
      g.fillRect(-R * 1.3, -R * 1.3, R * 2.6, R * 2.6);
      sg = g.createRadialGradient(R * 0.6, R * 0.45, 0, R * 0.6, R * 0.45, R * 1.7);
      sg.addColorStop(0, "rgba(25,5,35,0.28)");
      sg.addColorStop(1, "rgba(25,5,35,0)");
      g.fillStyle = sg;
      g.fillRect(-R * 1.3, -R * 1.3, R * 2.6, R * 2.6);
      // fine petal grain
      g.globalAlpha = 0.07;
      g.fillStyle = g.createPattern(grainTex, "repeat");
      g.fillRect(-R * 1.3, -R * 1.3, R * 2.6, R * 2.6);
      g.restore();
      layers.push(sp);
    }

    const center = makeSprite(size * 0.20);
    const cg = center.g;
    const CR = size * 0.15;
    let ao = cg.createRadialGradient(0, 0, 0, 0, 0, CR * 1.3);
    ao.addColorStop(0, "rgba(30,5,15,0.45)");
    ao.addColorStop(1, "rgba(30,5,15,0)");
    cg.fillStyle = ao;
    cg.fillRect(-CR * 1.3, -CR * 1.3, CR * 2.6, CR * 2.6);
    const n = Math.max(16, Math.round(CR * CR * 0.55));
    const cc = CR / Math.sqrt(n);
    for (let i = 0; i < n; i++) {
      const r = cc * Math.sqrt(i);
      const a = i * GOLDEN;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      const dr = CR * rand(0.10, 0.15) * (1 - r / (CR * 2.4));
      const dg = cg.createRadialGradient(x - dr * 0.4, y - dr * 0.4, 0, x, y, dr);
      dg.addColorStop(0, hsl(h - 4, 85, 40));
      dg.addColorStop(1, hsl(h - 12, 80, 22));
      cg.fillStyle = dg;
      cg.beginPath();
      cg.arc(x, y, dr, 0, TAU);
      cg.fill();
    }

    return { layers, center, size, hue: h };
  }

  function drawHead(t) {
    const bloom = bloomAmount();
    if (bloom <= 0) return;
    const sway = reducedMotion ? 0 : Math.sin(t * 0.5) * 0.035;
    const breath = reducedMotion ? 1 : 1 + Math.sin(t * 0.85) * 0.012;
    ctx.save();
    ctx.translate(HEADX, HEADY);
    ctx.rotate(-0.30 + sway);
    ctx.scale(1, 0.74);
    const n = flower.layers.length;
    for (let li = 0; li < n; li++) {
      const delay = li / (n + 1);
      const lb = clamp((bloom - delay) / (1 - delay), 0, 1);
      if (lb <= 0) continue;
      const eased = 1 - Math.pow(1 - lb, 2);
      const s = (0.22 + 0.78 * eased) * breath;
      const lift = li * flower.size * 0.085;
      const sp = flower.layers[li];
      ctx.save();
      ctx.translate(-0.18 * lift, -0.95 * lift);
      ctx.rotate((1 - eased) * 0.35);
      ctx.scale(s, s);
      ctx.drawImage(sp.canvas, -sp.logical / 2, -sp.logical / 2, sp.logical, sp.logical);
      ctx.restore();
    }
    const cb = Math.min(1, bloom * 1.5);
    if (cb > 0.05) {
      const lift = n * flower.size * 0.085;
      ctx.save();
      ctx.translate(-0.18 * lift, -0.95 * lift);
      ctx.scale(cb * breath, cb * breath);
      const c = flower.center;
      ctx.drawImage(c.canvas, -c.logical / 2, -c.logical / 2, c.logical, c.logical);
      ctx.restore();
    }
    // moonlight halation on the petals' moonward edge
    const rim = bloom * moonRise();
    if (rim > 0.1) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const rg = ctx.createRadialGradient(
        -flower.size * 0.55, -flower.size * 0.42, flower.size * 0.05,
        -flower.size * 0.30, -flower.size * 0.20, flower.size * 1.2);
      rg.addColorStop(0, `rgba(255,228,180,${0.12 * rim})`);
      rg.addColorStop(0.5, `rgba(255,220,170,${0.05 * rim})`);
      rg.addColorStop(1, "rgba(255,220,170,0)");
      ctx.fillStyle = rg;
      ctx.fillRect(-flower.size * 1.3, -flower.size * 1.3, flower.size * 2.6, flower.size * 2.6);
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------
  // Stem, leaves, calyx
  // ---------------------------------------------------------------
  // the bank the marigold grows from, rising in the bottom-right corner
  function bankTopAt(x) {
    const u = clamp((x - W * 0.55) / (W * 0.45), 0, 1);
    return H * (1.0 - 0.15 * smooth(u)) - 7 * Math.sin(u * 5.2) - 4 * Math.sin(u * 11.7);
  }

  function seedBank() {
    grassBlades.length = 0;
    for (let i = 0; i < 20; i++) {
      const u = i / 19;
      const bx = W * (0.585 + 0.39 * u) + rand(-12, 12);
      grassBlades.push({
        x: bx,
        y: bankTopAt(bx) + rand(-2, 5),
        h: rand(26, 82) * (0.75 + 0.45 * Math.abs(Math.sin(u * 4.2 + 1))),
        lean: rand(-0.38, -0.05),
        ph: rand(0, TAU),
        w: rand(1.3, 2.6),
        front: Math.random() < 0.45,
      });
    }
    cattails.length = 0;
    for (const ux of [0.905, 0.958]) {
      const bx = W * ux + rand(-6, 6);
      cattails.push({
        x: bx, y: bankTopAt(bx),
        h: rand(0.16, 0.21) * H,
        ph: rand(0, TAU),
        headH: rand(22, 34),
      });
    }
    mists.length = 0;
    for (let i = 0; i < 3; i++) {
      mists.push({
        x: rand(0, W),
        y: WL + 5 + i * 11 + rand(-2, 2),
        w: rand(0.4, 0.75) * W,
        h: rand(7, 13),
        v: rand(2.5, 6.5) * (Math.random() < 0.5 ? -1 : 1),
        a: rand(0.035, 0.06),
        ph: rand(0, TAU),
      });
    }
  }

  function drawBank(t) {
    ctx.fillStyle = "#0b0714";
    ctx.beginPath();
    ctx.moveTo(W * 0.55, H + 4);
    for (let x = W * 0.55; x <= W + 26; x += 22) ctx.lineTo(x, bankTopAt(x));
    ctx.lineTo(W + 4, H + 4);
    ctx.closePath();
    ctx.fill();
    // the crest catches a thread of moonlight
    ctx.strokeStyle = "rgba(205,195,225,0.10)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let first = true;
    for (let x = W * 0.55; x <= W + 26; x += 22) {
      const y = bankTopAt(x);
      first ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      first = false;
    }
    ctx.stroke();
  }

  function drawBlade(b, t) {
    const sway = reducedMotion ? 0 : Math.sin(t * 0.9 + b.ph) * 0.06;
    const lean = b.lean + sway;
    const tipx = b.x + Math.sin(lean) * b.h * 1.15;
    const tipy = b.y - Math.cos(lean) * b.h;
    const cx = b.x + Math.sin(lean * 0.4) * b.h * 0.3;
    const cy = b.y - b.h * 0.55;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#101c12";
    ctx.lineWidth = b.w;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.quadraticCurveTo(cx, cy, tipx, tipy);
    ctx.stroke();
    ctx.strokeStyle = "rgba(190,220,190,0.16)"; // moonlit edge
    ctx.lineWidth = b.w * 0.4;
    ctx.beginPath();
    ctx.moveTo(b.x - 1, b.y);
    ctx.quadraticCurveTo(cx - 1, cy, tipx - 1, tipy);
    ctx.stroke();
  }

  function drawGrass(t, front) {
    for (const b of grassBlades) {
      if (b.front !== front) continue;
      drawBlade(b, t);
    }
  }

  function drawCattails(t) {
    for (const c of cattails) {
      const sway = reducedMotion ? 0 : Math.sin(t * 0.7 + c.ph) * 5;
      const topx = c.x + sway, topy = c.y - c.h;
      ctx.strokeStyle = "#131e13";
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.quadraticCurveTo(c.x + sway * 0.4, c.y - c.h * 0.55, topx, topy);
      ctx.stroke();
      const grad = ctx.createLinearGradient(topx - 5, 0, topx + 5, 0);
      grad.addColorStop(0, "#3a2414");
      grad.addColorStop(0.45, "#241608");
      grad.addColorStop(1, "#160d05");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(topx, topy + c.headH * 0.4, 5, c.headH * 0.5, sway * 0.004, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "rgba(220,205,190,0.14)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(topx, topy + c.headH * 0.4, 5, c.headH * 0.5, sway * 0.004, -2.4, -0.8);
      ctx.stroke();
    }
  }

  function drawMist(dt, t) {
    for (const m of mists) {
      m.x += m.v * dt * (reducedMotion ? 0 : 1);
      if (m.x < -m.w) m.x = W + m.w * 0.5;
      if (m.x > W + m.w) m.x = -m.w * 0.5;
      const bob = reducedMotion ? 0 : Math.sin(t * 0.3 + m.ph) * 1.5;
      const g = ctx.createRadialGradient(m.x, m.y + bob, 0, m.x, m.y + bob, m.w / 2);
      g.addColorStop(0, `rgba(205,190,225,${m.a * moonRise()})`);
      g.addColorStop(1, "rgba(205,190,225,0)");
      ctx.save();
      ctx.translate(m.x, m.y + bob);
      ctx.scale(1, m.h / (m.w / 2));
      ctx.translate(-m.x, -(m.y + bob));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(m.x, m.y + bob, m.w / 2, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function buildStem() {
    const P0 = { x: W * 0.885, y: H * 0.925 };
    const P1 = { x: W * 0.92, y: H * 0.80 };
    const P2 = { x: W * 0.72, y: H * 0.68 };
    const glHead = !!gl;
    const P3 = glHead
      ? { x: HEADX + flower.size * 0.22, y: HEADY + flower.size * 0.84 }
      : { x: HEADX + flower.size * 0.16, y: HEADY + flower.size * 0.42 };
    stemPts = [];
    const N = 60;
    for (let i = 0; i <= N; i++) {
      const u = i / N, v = 1 - u;
      stemPts.push({
        x: v * v * v * P0.x + 3 * v * v * u * P1.x + 3 * v * u * u * P2.x + u * u * u * P3.x,
        y: v * v * v * P0.y + 3 * v * v * u * P1.y + 3 * v * u * u * P2.y + u * u * u * P3.y,
      });
    }
    stemLen = 0;
    stemPts[0].d = 0;
    for (let i = 1; i < stemPts.length; i++) {
      stemLen += Math.hypot(stemPts[i].x - stemPts[i - 1].x, stemPts[i].y - stemPts[i - 1].y);
      stemPts[i].d = stemLen;
    }
    leaves.length = 0;
    for (const [u, side] of [[0.30, -1], [0.52, 1], [0.72, -1]]) {
      const i = Math.round(u * N);
      const p = stemPts[i], q = stemPts[Math.min(N, i + 2)];
      const tang = Math.atan2(q.y - p.y, q.x - p.x);
      leaves.push({
        u, x: p.x, y: p.y,
        ang: tang + side * rand(0.7, 1.0),
        len: flower.size * rand(0.7, 1.0),
        side,
      });
    }
  }

  function drawLeafShape(x, y, ang, len, sway) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang + sway);
    const grad = ctx.createLinearGradient(0, 0, len, 0);
    grad.addColorStop(0, "#17301f");
    grad.addColorStop(0.6, "#22402a");
    grad.addColorStop(1, "#2c5233");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * 0.5, -len * 0.30, len, -len * 0.05);
    ctx.quadraticCurveTo(len * 0.5, len * 0.20, 0, 0);
    ctx.fill();
    ctx.strokeStyle = "rgba(210,235,215,0.22)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * 0.5, -len * 0.30, len, -len * 0.05);
    ctx.stroke();
    ctx.restore();
  }

  function drawStem(t) {
    const prog = stemProgress();
    if (prog <= 0.01) return;
    const endD = prog * stemLen;
    const sway = reducedMotion ? 0 : Math.sin(t * 0.5) * 2.5;
    const lw = Math.max(3, flower.size * 0.09);
    ctx.lineCap = "round";
    ctx.strokeStyle = "#1c3423";
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(stemPts[0].x, stemPts[0].y);
    let i = 1;
    for (; i < stemPts.length && stemPts[i].d <= endD; i++) {
      const f = stemPts[i].d / stemLen;
      ctx.lineTo(stemPts[i].x + sway * f, stemPts[i].y);
    }
    ctx.stroke();
    ctx.strokeStyle = "rgba(190,230,200,0.30)";
    ctx.lineWidth = lw * 0.28;
    ctx.beginPath();
    ctx.moveTo(stemPts[0].x - lw * 0.28, stemPts[0].y);
    for (let j = 1; j < i; j++) {
      const f = stemPts[j].d / stemLen;
      ctx.lineTo(stemPts[j].x - lw * 0.28 + sway * f, stemPts[j].y);
    }
    ctx.stroke();

    const leafSway = reducedMotion ? 0 : Math.sin(t * 0.8) * 0.05;
    for (const lf of leaves) {
      if (lf.u > prog) continue;
      const grow = smooth(clamp((prog - lf.u) / 0.12, 0, 1));
      drawLeafShape(lf.x + sway * lf.u, lf.y, lf.ang, lf.len * grow, leafSway * lf.side);
    }

    if (prog > 0.97) {
      const bx = HEADX + flower.size * (gl ? 0.22 : 0.16) + sway;
      const by = HEADY + flower.size * (gl ? 0.82 : 0.40);
      ctx.fillStyle = "#234427";
      for (const a of [-0.55, -0.1, 0.4]) {
        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(a - 0.3);
        ctx.beginPath();
        ctx.moveTo(-flower.size * 0.06, 0);
        ctx.quadraticCurveTo(flower.size * 0.06, -flower.size * 0.28, 0, -flower.size * 0.44);
        ctx.quadraticCurveTo(-flower.size * 0.14, -flower.size * 0.26, -flower.size * 0.06, 0);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  // ---------------------------------------------------------------
  // Fireflies, pollen, petals, ripples, shooting star (2D overlay)
  // ---------------------------------------------------------------
  function drawFireflies(t) {
    const vis = moonRise();
    if (vis <= 0.3) return;
    for (const f of fireflies) {
      const x = f.x + Math.sin(t * 0.29 * f.sp + f.dx) * 46;
      const y = f.y + Math.sin(t * 0.22 * f.sp + f.dy) * 26;
      const pulse = (0.2 + 0.8 * Math.pow(Math.abs(Math.sin(t * f.sp + f.ph)), 2)) * (vis - 0.3) / 0.7;
      const r = 4 + pulse * 4;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(255,238,180,${0.45 * pulse})`);
      g.addColorStop(1, "rgba(255,238,180,0)");
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.fillStyle = `rgba(255,250,225,${0.8 * pulse})`;
      ctx.beginPath();
      ctx.arc(x, y, 1, 0, TAU);
      ctx.fill();
    }
  }

  function updateShootingStar(dt) {
    if (reducedMotion) return;
    if (!shootingStar && movieT > nextShooting) {
      const fromLeft = Math.random() < 0.5;
      shootingStar = {
        x: fromLeft ? rand(-40, W * 0.25) : rand(W * 0.75, W + 40),
        y: rand(H * 0.04, H * 0.28),
        vx: (fromLeft ? 1 : -1) * rand(480, 700),
        vy: rand(90, 170),
        life: 1,
      };
      nextShooting = movieT + rand(12, 26);
    }
    if (shootingStar) {
      const s = shootingStar;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life -= dt * 1.1;
      if (s.life <= 0 || s.y > WL * 0.9) { shootingStar = null; return; }
      const tail = 90 * s.life;
      const ang = Math.atan2(s.vy, s.vx);
      const g = ctx.createLinearGradient(s.x, s.y, s.x - Math.cos(ang) * tail, s.y - Math.sin(ang) * tail);
      g.addColorStop(0, `rgba(255,250,235,${0.9 * s.life})`);
      g.addColorStop(1, "rgba(255,250,235,0)");
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - Math.cos(ang) * tail, s.y - Math.sin(ang) * tail);
      ctx.stroke();
    }
  }

  function spawnRipple(x, y, big) {
    ripples.push({ x, y, r: big ? 6 : 3, v: big ? 34 : 22, a: big ? 0.4 : 0.26 });
  }

  function drawRipples(dt) {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += r.v * dt;
      r.a -= dt * 0.2;
      if (r.a <= 0) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(240,225,240,${r.a})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.r, r.r * 0.30, 0, 0, TAU);
      ctx.stroke();
    }
  }

  function updatePollen(dt, t) {
    const bloom = bloomAmount();
    if (!reducedMotion && bloom > 0.75 && pollen.length < 36 && Math.random() < dt * 7) {
      pollen.push({
        x: HEADX + rand(-flower.size * 0.3, flower.size * 0.3),
        y: HEADY - flower.size * 0.35,
        vx: rand(-8, 2),
        vy: rand(-30, -14),
        wob: rand(0, TAU), ws: rand(0.8, 2),
        r: rand(0.7, 1.9),
        a: rand(0.45, 0.9),
        drift: true,
      });
    }
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = pollen.length - 1; i >= 0; i--) {
      const p = pollen[i];
      if (p.drift) {
        p.vx += ((NX - p.x) * 0.05 - p.vx * 0.35) * dt * 2.2;
        p.vy += ((NY - p.y) * 0.045 - p.vy * 0.30) * dt * 2.2;
      }
      p.x += (p.vx + Math.sin(t * p.ws + p.wob) * 9) * dt;
      p.y += p.vy * dt;
      const dist = Math.hypot(p.x - NX, p.y - NY);
      const fade = p.drift ? clamp(dist / 120, 0, 1) : (p.a -= dt * 0.5, 1);
      if ((p.drift && dist < 26) || p.a <= 0 || p.y < 0) { pollen.splice(i, 1); continue; }
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3.2);
      g.addColorStop(0, `rgba(255,215,130,${p.a * fade})`);
      g.addColorStop(1, "rgba(255,215,130,0)");
      ctx.fillStyle = g;
      ctx.fillRect(p.x - p.r * 3.2, p.y - p.r * 3.2, p.r * 6.4, p.r * 6.4);
    }
    ctx.restore();
  }

  function petalShape(g, s) {
    g.beginPath();
    g.moveTo(-s, 0);
    g.quadraticCurveTo(0, -s * 0.7, s, 0);
    g.quadraticCurveTo(0, s * 0.45, -s, 0);
  }

  function updateAirPetals(dt, t) {
    if (!reducedMotion && bloomAmount() > 0.95 && movieT > nextShed) {
      airPetals.push({
        x: HEADX + rand(-flower.size * 0.4, flower.size * 0.2),
        y: HEADY + rand(-10, 10),
        vx: rand(-30, -10), vy: rand(-6, 6),
        rot: rand(0, TAU), rv: rand(-2, 2),
        s: rand(5, 9), a: rand(0.65, 0.9),
      });
      nextShed = movieT + rand(5, 11);
    }
    for (let i = airPetals.length - 1; i >= 0; i--) {
      const p = airPetals[i];
      p.vy += 20 * dt;
      p.vx *= 1 - dt * 0.25;
      p.x += (p.vx + Math.sin(t * 1.8 + p.rot) * 14) * dt;
      p.y += p.vy * dt;
      p.rot += p.rv * dt;
      if (p.y >= WL + rand(10, 90)) {
        spawnRipple(p.x, p.y, false);
        waterPetals.push({ x: p.x, y: p.y, s: p.s, a: 0.7, ph: rand(0, TAU), vx: rand(-7, -2) });
        airPetals.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.a;
      const pg = ctx.createLinearGradient(-p.s, 0, p.s, 0);
      pg.addColorStop(0, hsl(flower.hue - 8, 85, 46));
      pg.addColorStop(1, hsl(flower.hue + 8, 92, 60));
      ctx.fillStyle = pg;
      petalShape(ctx, p.s);
      ctx.fill();
      ctx.restore();
    }
  }

  function updateWaterPetals(dt, t) {
    for (let i = waterPetals.length - 1; i >= 0; i--) {
      const p = waterPetals[i];
      p.x += p.vx * dt;
      p.a -= dt * 0.024;
      if (p.a <= 0 || p.x < -20 || p.x > W + 20) { waterPetals.splice(i, 1); continue; }
      const bob = Math.sin(t * 1.4 + p.ph) * 1.5;
      ctx.save();
      ctx.translate(p.x, p.y + bob);
      ctx.scale(1, 0.45);
      ctx.globalAlpha = p.a;
      ctx.fillStyle = hsl(flower.hue, 88, 55);
      petalShape(ctx, p.s);
      ctx.fill();
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------
  // Layout & seeding
  // ---------------------------------------------------------------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    fxCanvas.width = W * DPR;
    fxCanvas.height = H * DPR;
    fxCanvas.style.width = W + "px";
    fxCanvas.style.height = H + "px";
    // the ray-traced background reads perfectly at reduced resolution
    skyCanvas.width = Math.ceil(W * DPR * 0.72);
    skyCanvas.height = Math.ceil(H * DPR * 0.72);
    skyCanvas.style.width = W + "px";
    skyCanvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    NX = W * 0.46;
    NY = H * 0.26;
    WL = H * 0.64; // matches the shader camera's horizon
    flower = buildMarigold(clamp(Math.min(W, H) * 0.155, 55, 110));
    HEADX = W * 0.72;
    HEADY = H * 0.45;

    renderName();
    buildStem();
    seedBank();
    seedFallback();
    grainPattern = ctx.createPattern(grainTex, "repeat");

    fireflies.length = 0;
    for (let i = 0; i < 9; i++) {
      fireflies.push({
        x: rand(W * 0.05, W * 0.6), y: rand(WL - 30, H * 0.86),
        ph: rand(0, TAU), sp: rand(0.5, 1.3),
        dx: rand(0, TAU), dy: rand(0, TAU),
      });
    }
  }

  // ---------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------
  let last = performance.now();
  let filmStart = null;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;
    // the film clock follows real time, whatever the frame rate
    if (filmStart === null) filmStart = now - (reducedMotion ? 40000 : 0);
    movieT = (now - filmStart) / 1000;

    if (gl) {
      drawShaderBackground(t);
      ctx.clearRect(0, 0, W, H);
    } else {
      drawFallbackBackground(dt, t);
    }

    updateShootingStar(dt);
    drawName(t);
    drawMist(dt, t);
    drawRipples(dt);
    drawFireflies(t);
    updateWaterPetals(dt, t);
    drawBank(t);
    drawGrass(t, false);
    drawStem(t);
    if (!gl) drawHead(t);
    drawGrass(t, true);
    drawCattails(t);
    updateAirPetals(dt, t);
    updatePollen(dt, t);

    // vignette
    const v = ctx.createRadialGradient(W * 0.5, H * 0.45, Math.min(W, H) * 0.45, W * 0.5, H * 0.45, Math.hypot(W, H) * 0.62);
    v.addColorStop(0, "rgba(0,0,0,0)");
    v.addColorStop(1, "rgba(5,2,12,0.5)");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);

    // cinematic letterbox for the film, lifting for the living hold
    if (!reducedMotion) {
      const bar = H * 0.082 * smooth(clamp(movieT / 1.4, 0, 1)) *
        (1 - smooth(clamp((movieT - 30.5) / 1.8, 0, 1)));
      if (bar > 0.5) {
        ctx.fillStyle = "#030109";
        ctx.fillRect(0, 0, W, bar);
        ctx.fillRect(0, H - bar, W, bar);
      }
      const fade = 1 - smooth(clamp(movieT / 2.6, 0, 1));
      if (fade > 0) {
        ctx.fillStyle = `rgba(1,0,4,${fade})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    // a breath of film grain over the whole frame
    if (grainPattern) {
      ctx.save();
      ctx.globalAlpha = 0.035;
      ctx.globalCompositeOperation = "overlay";
      const gx = reducedMotion ? 0 : (Math.random() * 96) | 0;
      const gy = reducedMotion ? 0 : (Math.random() * 96) | 0;
      ctx.translate(-gx, -gy);
      ctx.fillStyle = grainPattern;
      ctx.fillRect(0, 0, W + 96, H + 96);
      ctx.restore();
    }

    if (!iconsShown && movieT > 31) {
      iconsShown = true;
      document.getElementById("film-replay").classList.add("show");
      document.getElementById("film-home").classList.add("show");
    }

    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------
  // Interaction: touch the water or the sky; replay / home
  // ---------------------------------------------------------------
  function touch(x, y) {
    if (y > WL) {
      spawnRipple(x, y, true);
      waterPetals.push({ x, y, s: rand(4, 7), a: 0.8, ph: rand(0, TAU), vx: rand(-7, -2) });
    } else {
      for (let i = 0; i < 6; i++) {
        pollen.push({
          x: x + rand(-6, 6), y: y + rand(-6, 6),
          vx: rand(-8, 8), vy: rand(-18, -6),
          wob: rand(0, TAU), ws: rand(1, 2.4),
          r: rand(0.7, 1.6), a: rand(0.5, 0.9),
          drift: false,
        });
      }
    }
  }
  window.addEventListener("click", (e) => touch(e.clientX, e.clientY));
  window.addEventListener("touchstart", (e) => {
    const t0 = e.touches[0];
    if (t0) touch(t0.clientX, t0.clientY);
  }, { passive: true });
  window.addEventListener("resize", resize);
  document.getElementById("film-replay").addEventListener("click", () => location.reload());
  document.getElementById("film-home").href = "./" + location.search;

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  initGL();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
