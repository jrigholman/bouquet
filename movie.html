<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowers from Jon</title>
<meta name="theme-color" content="#33182b">
<meta property="og:title" content="Flowers from Jon">
<meta property="og:type" content="website">
<meta property="og:url" content="https://flowers.wcomops.com/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Flowers from Jon">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1c0f18;
  }

  #garden {
    position: fixed;
    inset: 0;
    display: block;
  }

  .film-btn {
    position: fixed;
    bottom: 1.1rem;
    font-size: 1.7rem;
    line-height: 1;
    color: rgba(255, 228, 195, 0.7);
    text-decoration: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease, color 0.3s ease;
    z-index: 3;
    cursor: pointer;
    user-select: none;
  }
  .film-btn.show { opacity: 1; pointer-events: auto; }
  .film-btn:hover { color: rgba(255, 240, 215, 1); }
  #film-replay { right: 1.3rem; }
  #film-home { left: 1.3rem; }
</style>
</head>
<body>
<canvas id="garden"></canvas>
<div id="film-replay" class="film-btn" role="button" aria-label="replay">&#8635;</div>
<a id="film-home" class="film-btn" aria-label="interactive bouquet">&#128144;</a>

<script>
(function () {
  "use strict";

  // ----- personalization: ?name=Sofia -----
  const params = new URLSearchParams(location.search);
  const NAME = (params.get("name") || "Mary").slice(0, 24);
  document.title = "A Bouquet for " + NAME;

  const canvas = document.getElementById("garden");
  const ctx = canvas.getContext("2d");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const GOLDEN = 2.399963; // golden angle, for floret spirals

  let W = 0, H = 0, CX = 0, CY = 0, DPR = 1;
  let clearRadius = 120;
  let nameHalfH = 60;
  let vignette = null;
  let nameSprite = null;
  let animT = 0;      // world clock (slows during the slow-motion act)
  let movieT = 0;     // real film clock
  let heroVine = null;
  let iconsShown = false;
  const cam = { x: 0, y: 0, z: 1 };

  const mouse = { x: -9999, y: -9999, active: false };
  const vines = [];
  const tumblers = [];
  const butterflies = [];
  const gust = { active: false, t0: 0, dir: 1, startX: 0, speed: 350, width: 220, amp: 0.16, next: 9 };
  const sparkles = [];
  const driftPetals = [];
  const hearts = [];
  const motes = [];
  const bokehs = [];

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (v) => v * v * (3 - 2 * v);
  const hsl = (h, s, l, a = 1) => `hsla(${h.toFixed(1)},${s.toFixed(1)}%,${l.toFixed(1)}%,${a})`;

  // ---------------------------------------------------------------
  // The name, pre-rendered with its glow so vines and blooms can sit
  // both behind and in front of it
  // ---------------------------------------------------------------
  function renderName() {
    const fontSize = clamp(W * 0.125, 52, 165);
    const font = `italic bold ${fontSize}px Georgia, "Palatino Linotype", serif`;
    ctx.font = font;
    const textW = ctx.measureText(NAME).width;
    clearRadius = textW * 0.5 + fontSize * 0.15;
    nameHalfH = fontSize * 0.62;

    const pad = fontSize * 0.6;
    const c = document.createElement("canvas");
    const lw = textW + pad * 2;
    const lh = fontSize * 1.35 + pad * 2;
    c.width = Math.ceil(lw * DPR);
    c.height = Math.ceil(lh * DPR);
    const g = c.getContext("2d");
    g.scale(DPR, DPR);
    g.textAlign = "center";
    g.textBaseline = "middle";

    const nx = lw / 2, ny = pad + fontSize * 0.62;

    g.font = font;
    g.shadowColor = "rgba(255,170,90,0.85)";
    g.shadowBlur = fontSize * 0.28;
    g.fillStyle = "rgba(255,214,150,0.9)";
    g.fillText(NAME, nx, ny);
    g.shadowBlur = fontSize * 0.10;
    g.fillText(NAME, nx, ny);
    g.shadowBlur = 0;

    const grad = g.createLinearGradient(0, ny - fontSize * 0.55, 0, ny + fontSize * 0.55);
    grad.addColorStop(0, "#fffbe9");
    grad.addColorStop(0.35, "#ffe9b0");
    grad.addColorStop(0.62, "#ffcb72");
    grad.addColorStop(1, "#e08a3c");
    g.fillStyle = grad;
    g.fillText(NAME, nx, ny);

    nameSprite = { canvas: c, w: lw, h: lh, ox: nx, oy: ny };
  }

  function drawName(t, alpha) {
    if (!nameSprite || alpha <= 0) return;
    const s = nameSprite;
    const pulse = reducedMotion ? 0 : (Math.sin(t * 1.2) + 1) / 2;
    const scale = (1 + pulse * 0.012) * (0.955 + 0.045 * alpha); // eases up as it reveals
    ctx.save();
    ctx.translate(CX, CY);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.drawImage(s.canvas, -s.ox, -s.oy, s.w, s.h);
    if (pulse > 0) {
      ctx.globalAlpha = alpha * pulse * 0.28;
      ctx.globalCompositeOperation = "lighter";
      ctx.drawImage(s.canvas, -s.ox, -s.oy, s.w, s.h);
    }
    ctx.restore();
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H * 0.44;

    vignette = ctx.createRadialGradient(CX, CY, Math.min(W, H) * 0.44, CX, CY, Math.hypot(CX, CY) * 1.08);
    vignette.addColorStop(0, "rgba(0,0,0,0)");
    vignette.addColorStop(1, "rgba(10,2,8,0.52)");

    renderName();
    seedBokeh();
    seedWreath();
    seedTumblers();
  }

  // ---------------------------------------------------------------
  // Flower species
  // ---------------------------------------------------------------
  const SPECIES = {
    marigold: { weight: 0.42, size: [26, 44], bud: [32, 95, 55] },
    rose:     { weight: 0.26, size: [26, 42], bud: [348, 70, 55] },
    cosmos:   { weight: 0.18, size: [22, 34], bud: [332, 70, 70] },
    aster:    { weight: 0.14, size: [17, 27], bud: [264, 55, 65] },
  };

  function pickSpecies() {
    let r = Math.random();
    for (const key of Object.keys(SPECIES)) {
      r -= SPECIES[key].weight;
      if (r <= 0) return key;
    }
    return "marigold";
  }

  // ---------------------------------------------------------------
  // Petal geometry (each drawn pointing along +x, base at origin)
  // ---------------------------------------------------------------
  function marigoldPetalPath(g, L, w) {
    const r0 = L * 0.10;
    g.beginPath();
    g.moveTo(r0, 0);
    g.bezierCurveTo(L * 0.30, -w * 0.9, L * 0.62, -w, L * 0.80, -w * 0.70);
    g.quadraticCurveTo(L * 1.03, -w * 0.48, L * 0.93, -w * 0.22);
    g.quadraticCurveTo(L * 1.07, 0, L * 0.93, w * 0.22);
    g.quadraticCurveTo(L * 1.03, w * 0.48, L * 0.80, w * 0.70);
    g.bezierCurveTo(L * 0.62, w, L * 0.30, w * 0.9, r0, 0);
    g.closePath();
  }

  function rosePetalPath(g, L, w) {
    const r0 = L * 0.08;
    g.beginPath();
    g.moveTo(r0, 0);
    g.bezierCurveTo(L * 0.22, -w * 0.95, L * 0.70, -w * 1.02, L * 0.92, -w * 0.45);
    g.quadraticCurveTo(L * 1.05, 0, L * 0.92, w * 0.45);
    g.bezierCurveTo(L * 0.70, w * 1.02, L * 0.22, w * 0.95, r0, 0);
    g.closePath();
  }

  function cosmosPetalPath(g, L, w) {
    const r0 = L * 0.08;
    g.beginPath();
    g.moveTo(r0, 0);
    g.bezierCurveTo(L * 0.25, -w * 0.75, L * 0.72, -w, L * 0.90, -w * 0.55);
    g.quadraticCurveTo(L * 1.0, -w * 0.38, L * 0.99, -w * 0.30);
    g.lineTo(L * 0.92, -w * 0.16);
    g.lineTo(L * 1.02, -w * 0.04);
    g.lineTo(L * 0.93, w * 0.10);
    g.lineTo(L * 1.0, w * 0.26);
    g.quadraticCurveTo(L * 0.97, w * 0.40, L * 0.90, w * 0.55);
    g.bezierCurveTo(L * 0.72, w, L * 0.25, w * 0.75, r0, 0);
    g.closePath();
  }

  function asterPetalPath(g, L, w) {
    const r0 = L * 0.12;
    g.beginPath();
    g.moveTo(r0, 0);
    g.bezierCurveTo(L * 0.38, -w, L * 0.88, -w * 0.85, L, 0);
    g.bezierCurveTo(L * 0.88, w * 0.85, L * 0.38, w, r0, 0);
    g.closePath();
  }

  // ---------------------------------------------------------------
  // Sprite pre-rendering
  // ---------------------------------------------------------------
  const SS = 2;

  function makeSprite(size) {
    const pad = 1.3;
    const logical = size * 2 * pad;
    const c = document.createElement("canvas");
    c.width = c.height = Math.max(8, Math.ceil(logical * SS));
    const g = c.getContext("2d");
    g.scale(SS, SS);
    g.translate(logical / 2, logical / 2);
    return { canvas: c, logical, g };
  }

  function bakeShading(sp, R) {
    const g = sp.g;
    g.save();
    g.globalCompositeOperation = "source-atop";
    let grad = g.createRadialGradient(-R * 0.4, -R * 0.4, 0, -R * 0.4, -R * 0.4, R * 1.7);
    grad.addColorStop(0, "rgba(255,255,240,0.18)");
    grad.addColorStop(1, "rgba(255,255,240,0)");
    g.fillStyle = grad;
    g.fillRect(-R * 1.4, -R * 1.4, R * 2.8, R * 2.8);
    grad = g.createRadialGradient(R * 0.55, R * 0.55, 0, R * 0.55, R * 0.55, R * 1.6);
    grad.addColorStop(0, "rgba(40,5,20,0.20)");
    grad.addColorStop(1, "rgba(40,5,20,0)");
    g.fillStyle = grad;
    g.fillRect(-R * 1.4, -R * 1.4, R * 2.8, R * 2.8);
    g.restore();
  }

  function petalRing(sp, opts) {
    const g = sp.g;
    const { count, R, width, path, base, mid, tip, angleOffset, veins, rim } = opts;
    g.save();
    g.shadowColor = "rgba(35,5,15,0.55)";
    g.shadowBlur = R * 0.17;
    g.shadowOffsetY = R * 0.06 * SS;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * TAU + angleOffset + rand(-0.05, 0.05);
      const L = R * rand(0.92, 1.08);
      const w = width * rand(0.88, 1.1);
      const jh = rand(-2.5, 2.5), jl = rand(-4, 4);
      g.save();
      g.rotate(a);
      path(g, L, w);
      const grad = g.createLinearGradient(0, 0, L, 0);
      grad.addColorStop(0, hsl(base[0] + jh, base[1], base[2] + jl * 0.6));
      grad.addColorStop(0.55, hsl(mid[0] + jh, mid[1], mid[2] + jl));
      grad.addColorStop(1, hsl(tip[0] + jh, tip[1], tip[2] + jl));
      g.fillStyle = grad;
      g.fill();
      if (rim) {
        g.strokeStyle = rim;
        g.lineWidth = 0.9;
        g.stroke();
      }
      g.strokeStyle = "rgba(60,10,25,0.10)";
      g.lineWidth = 0.7;
      g.beginPath();
      g.moveTo(L * 0.15, 0);
      g.quadraticCurveTo(L * 0.6, rand(-1, 1), L * 0.92, 0);
      g.stroke();
      if (veins) {
        g.strokeStyle = "rgba(80,20,40,0.10)";
        g.lineWidth = 0.6;
        for (const vy of [-0.3, 0.3]) {
          g.beginPath();
          g.moveTo(L * 0.15, 0);
          g.quadraticCurveTo(L * 0.55, w * vy * 1.1, L * 0.85, w * vy);
          g.stroke();
        }
      }
      g.restore();
    }
    g.restore();
  }

  function floretDisk(sp, R, dark, light) {
    const g = sp.g;
    const n = Math.max(14, Math.round(R * R * 0.55));
    const c = R / Math.sqrt(n);
    for (let i = 0; i < n; i++) {
      const r = c * Math.sqrt(i);
      const a = i * GOLDEN;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      const dotR = R * rand(0.10, 0.15) * (1 - r / (R * 2.4));
      const grad = g.createRadialGradient(x - dotR * 0.4, y - dotR * 0.4, 0, x, y, dotR);
      grad.addColorStop(0, light);
      grad.addColorStop(1, dark);
      g.fillStyle = grad;
      g.beginPath();
      g.arc(x, y, dotR, 0, TAU);
      g.fill();
    }
  }

  function roseCore(sp, R, h) {
    const g = sp.g;
    g.save();
    g.lineCap = "round";
    let a0 = rand(0, TAU);
    for (let k = 0; k < 7; k++) {
      const rr = R * (1 - k * 0.13);
      const light = k % 2 === 0;
      g.strokeStyle = hsl(h + (light ? 4 : -6), light ? 62 : 58, light ? 58 : 40);
      g.lineWidth = rr * 0.5;
      g.beginPath();
      g.arc(Math.cos(a0) * R * 0.08, Math.sin(a0) * R * 0.08, rr, a0, a0 + 3.6);
      g.stroke();
      a0 += 2.3;
    }
    g.fillStyle = hsl(h - 10, 55, 30);
    g.beginPath();
    g.arc(0, 0, R * 0.16, 0, TAU);
    g.fill();
    g.restore();
  }

  function centerAO(sp, R) {
    const g = sp.g;
    const grad = g.createRadialGradient(0, 0, 0, 0, 0, R * 1.25);
    grad.addColorStop(0, "rgba(30,5,15,0.42)");
    grad.addColorStop(1, "rgba(30,5,15,0)");
    g.fillStyle = grad;
    g.fillRect(-R * 1.25, -R * 1.25, R * 2.5, R * 2.5);
  }

  function buildSprites(type, size, hueJit) {
    const layers = [];
    let center = null;

    if (type === "marigold") {
      const h = 27 + hueJit;
      const nLayers = 5;
      for (let li = 0; li < nLayers; li++) {
        const f = li / (nLayers - 1);
        const R = size * (1 - li * 0.165);
        const sp = makeSprite(R);
        petalRing(sp, {
          count: Math.max(8, Math.round(14 - li * 1.6)),
          R,
          width: R * 0.34,
          path: marigoldPetalPath,
          base: [h - 14 + f * 6, 88, 30 + f * 9],
          mid: [h + f * 16, 96, 50 + f * 12],
          tip: [h + f * 12, 90, 44 + f * 11],
          angleOffset: li * 0.42,
          rim: hsl(h + 18, 95, 72, 0.3),
        });
        bakeShading(sp, R);
        layers.push(sp);
      }
      center = makeSprite(size * 0.20);
      centerAO(center, size * 0.17);
      floretDisk(center, size * 0.14, hsl(h - 12, 80, 22), hsl(h - 4, 85, 40));
    } else if (type === "rose") {
      const h = (Math.random() < 0.55 ? 344 : 355) + hueJit;
      const deep = h > 350;
      const nLayers = 5;
      for (let li = 0; li < nLayers; li++) {
        const f = li / (nLayers - 1);
        const R = size * (1 - li * 0.17);
        const sp = makeSprite(R);
        petalRing(sp, {
          count: Math.max(6, Math.round(10 - li * 1.2)),
          R,
          width: R * 0.42,
          path: rosePetalPath,
          base: [h - 6, deep ? 68 : 58, (deep ? 26 : 40) + f * 7],
          mid: [h, deep ? 74 : 66, (deep ? 44 : 62) + f * 9],
          tip: [h + 5, deep ? 70 : 62, (deep ? 38 : 56) + f * 9],
          angleOffset: li * 0.5 + 0.2,
          rim: hsl(h + 8, 80, deep ? 62 : 80, 0.35),
        });
        bakeShading(sp, R);
        layers.push(sp);
      }
      center = makeSprite(size * 0.34);
      centerAO(center, size * 0.28);
      roseCore(center, size * 0.26, h);
    } else if (type === "cosmos") {
      const h = 330 + hueJit * 1.5;
      for (const [scale, dl] of [[0.94, -14], [1, 0]]) {
        const R = size * scale;
        const sp = makeSprite(R);
        petalRing(sp, {
          count: 8,
          R,
          width: R * 0.30,
          path: cosmosPetalPath,
          base: [h, 62, 54 + dl],
          mid: [h + 4, 74, 78 + dl * 0.6],
          tip: [h + 4, 68, 72 + dl * 0.6],
          angleOffset: scale < 1 ? TAU / 16 : 0,
          veins: true,
          rim: hsl(h + 10, 80, 88, 0.35),
        });
        bakeShading(sp, R);
        layers.push(sp);
      }
      center = makeSprite(size * 0.28);
      centerAO(center, size * 0.23);
      floretDisk(center, size * 0.20, hsl(38, 95, 42), hsl(48, 100, 62));
    } else { // aster
      const h = 262 + hueJit * 1.8;
      for (const [scale, dl] of [[1, -10], [0.82, 0]]) {
        const R = size * scale;
        const sp = makeSprite(R);
        petalRing(sp, {
          count: 18,
          R,
          width: R * 0.10,
          path: asterPetalPath,
          base: [h - 6, 48, 48 + dl],
          mid: [h + 6, 62, 72 + dl * 0.6],
          tip: [h + 6, 56, 66 + dl * 0.6],
          angleOffset: scale < 1 ? TAU / 36 : 0,
          rim: hsl(h + 12, 70, 85, 0.3),
        });
        bakeShading(sp, R);
        layers.push(sp);
      }
      center = makeSprite(size * 0.30);
      centerAO(center, size * 0.25);
      floretDisk(center, size * 0.22, hsl(40, 92, 40), hsl(50, 100, 60));
    }

    const shadow = makeSprite(size);
    const sg = shadow.g;
    const grad = sg.createRadialGradient(0, 0, 0, 0, 0, size);
    grad.addColorStop(0, "rgba(0,0,0,0.40)");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    sg.fillStyle = grad;
    sg.beginPath();
    sg.arc(0, 0, size, 0, TAU);
    sg.fill();

    return { layers, center, shadow };
  }

  // ---------------------------------------------------------------
  // Flower model. Heads are RIGID: the layer-lift direction is fixed
  // per flower at creation, so petal rings never slide against each
  // other — all motion is whole-flower nod and sway.
  // ---------------------------------------------------------------
  let flowerId = 0;

  function baseFlower(type, size) {
    const spec = SPECIES[type];
    const stemHue = rand(98, 118);
    return {
      type, size,
      id: flowerId++,
      sprites: buildSprites(type, size, rand(-7, 7)),
      spin: rand(0, TAU),
      swayPhase: rand(0, TAU),
      breathPhase: rand(0, TAU),
      squash: rand(0.86, 0.95),
      tiltA: rand(-0.12, 0.12),
      liftX: rand(-0.15, 0.45),   // fixed light/tilt direction — never drifts
      liftY: rand(0.35, 0.75),
      stemCol: hsl(stemHue, 46, 27),
      stemHi: hsl(stemHue - 5, 42, 40, 0.75),
      budCol: hsl(spec.bud[0], spec.bud[1], spec.bud[2]),
      petalHue: spec.bud[0],
      bloomDur: rand(2.4, 3.6),
      age: 0,
      bloomAmount() {
        const p = clamp(this.age / this.bloomDur, 0, 1);
        return 1 - Math.pow(1 - p, 3);
      },
    };
  }

  // the head only: petal layers + floret center, opaque, rigid
  function drawHeadCore(g, fl, t) {
    const bloom = fl.bloomAmount();
    if (bloom <= 0) return;
    const { layers, center } = fl.sprites;
    const breath = reducedMotion ? 1 : 1 + Math.sin(t * 1.1 + fl.breathPhase) * 0.012;

    const n = layers.length;
    for (let li = 0; li < n; li++) {
      const delay = li / (n + 1);
      const lb = clamp((bloom - delay) / (1 - delay), 0, 1);
      if (lb <= 0) continue;
      const eased = 1 - Math.pow(1 - lb, 2);
      const s = (0.15 + 0.85 * eased) * breath;
      const lift = li * fl.size * 0.055;
      const sq = fl.squash * (0.92 + 0.10 * (n === 1 ? 1 : li / (n - 1)));

      const sp = layers[li];
      g.save();
      g.translate(-fl.liftX * lift, -fl.liftY * lift);
      g.scale(1, sq);
      g.rotate(fl.spin + (1 - eased) * 0.9);
      g.scale(s, s);
      g.drawImage(sp.canvas, -sp.logical / 2, -sp.logical / 2, sp.logical, sp.logical);
      g.restore();
    }

    const cb = Math.min(1, bloom * 1.5);
    if (cb > 0.05) {
      const lift = n * fl.size * 0.055;
      g.save();
      g.translate(-fl.liftX * lift, -fl.liftY * lift);
      g.scale(1, fl.squash * 1.04);
      g.rotate(fl.spin * 0.3);
      g.scale(cb * breath, cb * breath);
      g.drawImage(center.canvas, -center.logical / 2, -center.logical / 2, center.logical, center.logical);
      g.restore();
    }
  }

  function drawLeaf(g, lf, x, y, len, sway) {
    g.save();
    g.translate(x, y);
    g.rotate(lf.ang + sway);
    g.fillStyle = lf.col;
    g.beginPath();
    g.moveTo(0, 0);
    g.quadraticCurveTo(len * 0.5, -len * 0.34, len, -len * 0.06);
    g.quadraticCurveTo(len * 0.5, len * 0.24, 0, 0);
    g.fill();
    g.strokeStyle = "rgba(15,45,18,0.4)";
    g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(len * 0.06, -len * 0.01);
    g.quadraticCurveTo(len * 0.5, -len * 0.10, len * 0.92, -len * 0.05);
    g.stroke();
    g.restore();
  }

  function drawCalyx(g, fl, scale) {
    const s = fl.size * scale;
    for (const a of [[-0.16, 0.55, 0.10], [0, 0, 0.12], [0.16, -0.55, 0.10]]) {
      g.save();
      g.translate(a[0] * s, s * 0.42);
      g.rotate(a[1]);
      g.fillStyle = fl.stemCol;
      g.beginPath();
      g.moveTo(-s * 0.08, 0);
      g.quadraticCurveTo(a[2] * s, s * 0.30, 0, s * 0.52);
      g.quadraticCurveTo(-s * 0.14, s * 0.28, -s * 0.08, 0);
      g.fill();
      g.restore();
    }
  }

  // ---------------------------------------------------------------
  // Vines: each grows from below the bed along a swirling path around
  // the name, then follows the marigold life cycle at its anchor —
  // green bud swells, colour peeks from the crown, petals unfurl ring
  // by ring, and the bloom rests in place.
  // ---------------------------------------------------------------
  function catmullRom(way) {
    const pts = [];
    for (let i = 0; i < way.length - 1; i++) {
      const p0 = way[Math.max(0, i - 1)], p1 = way[i];
      const p2 = way[i + 1], p3 = way[Math.min(way.length - 1, i + 2)];
      const steps = 14;
      for (let j = 0; j < steps; j++) {
        const u = j / steps, u2 = u * u, u3 = u2 * u;
        pts.push({
          x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * u + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * u2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * u3),
          y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * u + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * u2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * u3),
        });
      }
    }
    pts.push({ x: way[way.length - 1].x, y: way[way.length - 1].y });
    let L = 0;
    pts[0].d = 0;
    for (let i = 1; i < pts.length; i++) {
      L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      pts[i].d = L;
    }
    return { pts, L };
  }

  function pointAtD(pts, d, cursor) {
    let i = cursor.i || 0;
    while (i < pts.length - 1 && pts[i + 1].d < d) i++;
    while (i > 0 && pts[i].d > d) i--;
    cursor.i = i;
    const a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)];
    const span = b.d - a.d || 1;
    const u = clamp((d - a.d) / span, 0, 1);
    return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
  }

  function wreathEllipse() {
    const rx = Math.min(clearRadius * 1.14, W * 0.5 - 60);
    const ry = clearRadius * 0.55 + 40;
    return { rx, ry };
  }

  // push a bloom's resting spot far enough out that its petals can
  // never touch the letters
  function clearAnchor(ax, ay, size) {
    const a = clearRadius + size * 1.3;
    const b = nameHalfH + size * 1.3;
    const nx = (ax - CX) / a, ny = (ay - CY) / b;
    const d2 = nx * nx + ny * ny;
    if (d2 < 1) {
      const m = 1.03 / Math.max(0.25, Math.sqrt(d2));
      ax = CX + (ax - CX) * m;
      ay = CY + (ay - CY) * m;
    }
    return { x: clamp(ax, 34, W - 34), y: clamp(ay, H * 0.05, H * 0.94) };
  }

  function makeVine(opts) {
    const type = opts.type || pickSpecies();
    const spec = SPECIES[type];
    const size = opts.size || rand(spec.size[0], spec.size[1]);
    const fl = baseFlower(type, size);
    const { rx, ry } = wreathEllipse();

    const anchor = { x: opts.ax, y: opts.ay };
    const way = [];
    const x0 = clamp(anchor.x + rand(-W * 0.22, W * 0.22), 40, W - 40);
    way.push({ x: x0, y: H + 50 });

    if (opts.ringAng !== undefined) {
      // swirl along the wreath ellipse to the anchor
      const entry = rand(0.5, Math.PI - 0.5); // bottom half of the ellipse
      let dir = Math.random() < 0.5 ? 1 : -1;
      let wrap = ((opts.ringAng - entry) * dir) % TAU;
      if (wrap < 0) wrap += TAU;
      if (wrap > TAU * 0.72) { dir = -dir; wrap = TAU - wrap; }
      const ex = CX + Math.cos(entry) * rx * 1.5;
      const ey = CY + Math.sin(entry) * ry * 1.6;
      way.push({ x: (x0 + ex) / 2 + rand(-70, 70), y: (H + ey) / 2 + rand(-30, 30) });
      const step = 0.55;
      for (let k = step; k < wrap; k += step) {
        const a = entry + dir * k;
        const f = 1.5 - 0.5 * (k / wrap);
        way.push({
          x: clamp(CX + Math.cos(a) * rx * f, 30, W - 30),
          y: CY + Math.sin(a) * ry * (f + 0.15),
        });
      }
    } else {
      // scatter anchor: S-curve with a small approach hook
      const m1 = { x: x0 + rand(-120, 120), y: H * 0.78 };
      const m2 = { x: (x0 + anchor.x) / 2 + rand(-90, 90), y: (H * 0.78 + anchor.y) / 2 + rand(-20, 60) };
      for (const m of [m1, m2]) {
        // keep waypoints out of the text zone, bending toward the anchor's
        // side so the path curves rather than zig-zagging across
        if (Math.abs(m.y - CY) < ry * 1.25 && Math.abs(m.x - CX) < rx * 1.3) {
          m.x = clamp(CX + Math.sign(anchor.x - CX || 1) * rx * rand(1.32, 1.5), 30, W - 30);
        }
        way.push(m);
      }
      way.push({ x: anchor.x + rand(-50, 50), y: anchor.y + rand(70, 130) });
    }
    way.push(anchor);

    const { pts, L } = catmullRom(way);

    // leaf stations along the vine
    const leaves = [];
    let d = rand(70, 130), side = Math.random() < 0.5 ? 1 : -1;
    const cursor = {};
    while (d < L - 70) {
      const p = pointAtD(pts, d, cursor);
      const p2 = pointAtD(pts, Math.min(L, d + 6), cursor);
      const tang = Math.atan2(p2.y - p.y, p2.x - p.x);
      leaves.push({
        d,
        x: p.x, y: p.y,
        ang: tang + side * rand(0.55, 0.95),
        len: size * rand(0.45, 0.7),
        col: hsl(rand(98, 118), rand(40, 52), rand(26, 36)),
      });
      side = -side;
      d += rand(85, 150);
    }

    // head orientation from the arrival tangent, eased toward upright
    const pe = pts[pts.length - 1], pp = pts[Math.max(0, pts.length - 8)];
    let headAng = Math.atan2(pe.y - pp.y, pe.x - pp.x) + Math.PI / 2;
    while (headAng > Math.PI) headAng -= TAU;
    while (headAng < -Math.PI) headAng += TAU;
    headAng *= 0.45;

    const delay = opts.delay !== undefined ? opts.delay : rand(0.2, 6.5);
    // choreography: solve the growth speed so the tip lands on cue
    const speed = opts.arrive !== undefined
      ? clamp(L / Math.max(0.6, opts.arrive - delay), 40, 460)
      : (opts.speed || rand(120, 200));
    return {
      fl, pts, L, leaves, headAng,
      progress: 0,
      cursor: {},
      delay,
      speed: speed * (reducedMotion ? 0 : 1),
      arrived: false,
      arriveT: 0,
      front: opts.front,
      lean: 0,
      swayPhase: rand(0, TAU),
      lw: Math.max(2, size * 0.075),
    };
  }

  // film choreography: the mass bloom lands in world-seconds 17–22,
  // sweeping outward from the center of the screen
  function bloomCue(x, y) {
    const maxD = Math.hypot(Math.max(CX, W - CX), H);
    return 17 + 4.2 * (Math.hypot(x - CX, y - H) / maxD) + rand(0, 0.8);
  }

  function seedWreath() {
    vines.length = 0;
    const { rx, ry } = wreathEllipse();

    // species cycle: every neighbourhood gets a balanced mix of colours
    const CYCLE = ["marigold", "rose", "marigold", "cosmos", "marigold", "rose", "aster", "marigold", "cosmos", "rose"];
    let ci = Math.floor(rand(0, CYCLE.length));
    const nextType = () => CYCLE[ci++ % CYCLE.length];

    const placed = [];

    // ring of blooms around the name — a calm, even ellipse
    const ringN = clamp(Math.round(W / 105), 10, 16);
    for (let i = 0; i < ringN; i++) {
      const a = (i / ringN) * TAU + rand(-0.08, 0.08);
      const f = rand(1.10, 1.18);
      const type = i % 2 === 0 ? "marigold" : nextType();
      const size = rand(25, 33);
      const p = clearAnchor(CX + Math.cos(a) * rx * f, CY + Math.sin(a) * ry * f, size);
      placed.push(p);
      vines.push(makeVine({
        ax: p.x, ay: p.y,
        ringAng: a,
        type,
        size,
        delay: rand(5, 8.5),
        arrive: bloomCue(p.x, p.y),
        front: Math.sin(a) > -0.15, // top-arc blooms peek from behind the name
      }));
    }

    // best-candidate (blue-noise) scatter: each new bloom lands as far as
    // possible from the ones already placed — even coverage, no clumps
    const scatterN = clamp(Math.round((W * H) / 42000), 16, 34);
    for (let i = 0; i < scatterN; i++) {
      let best = null, bestD = -1;
      for (let k = 0; k < 14; k++) {
        const cx = rand(W * 0.04, W * 0.96);
        const cy = rand(H * 0.05, H * 0.92);
        // keep candidates off the text and out of the wreath band
        const nx = (cx - CX) / (rx * 1.32), ny = (cy - CY) / (ry * 1.45);
        if (nx * nx + ny * ny < 1) continue;
        let nearest = Infinity;
        for (const q of placed) {
          const d = Math.hypot(cx - q.x, cy - q.y);
          if (d < nearest) nearest = d;
        }
        if (nearest > bestD) { bestD = nearest; best = { x: cx, y: cy }; }
      }
      if (!best) continue;
      const size = Math.random() < 0.2 ? rand(30, 37) : rand(21, 31);
      const p = clearAnchor(best.x, best.y, size);
      placed.push(p);
      vines.push(makeVine({
        ax: p.x, ay: p.y,
        size,
        type: nextType(),
        delay: rand(5, 8.5),
        arrive: bloomCue(p.x, p.y),
        front: Math.random() < 0.5,
      }));
    }

    // the hero: a large marigold beside the name whose sprouting and
    // bloom the camera follows in close-up
    const heroP = clearAnchor(
      clamp(CX - clearRadius * 1.7, W * 0.16, W * 0.42),
      CY + rand(-24, 24), 42);
    heroVine = makeVine({
      ax: heroP.x, ay: heroP.y,
      type: "marigold",
      size: 42,
      delay: 2.4,
      arrive: 13.6, // bud + slow-motion unfurl land in the close-up act
      front: true,
    });
    vines.push(heroVine);

    if (reducedMotion) {
      for (const v of vines) {
        v.progress = v.L;
        v.arrived = true;
        v.arriveT = -20;
        v.fl.age = 20;
      }
    }
  }

  function updateVine(v, dt) {
    if (animT < v.delay) return;
    if (!v.arrived) {
      v.progress += v.speed * dt;
      if (v.progress >= v.L) {
        v.progress = v.L;
        v.arrived = true;
        v.arriveT = animT;
      }
    } else {
      // marigold life cycle: bud swells (0–1.4s), colour peeks (1–1.8s),
      // petals unfurl (from 1.8s), then the bloom rests
      v.fl.age = Math.max(0, (animT - v.arriveT) - 1.8);
    }
    // heads lean away from the cursor
    const tip = v.pts[v.pts.length - 1];
    let target = 0;
    if (mouse.active && v.arrived && !reducedMotion) {
      const dx = tip.x - mouse.x, dy = tip.y - mouse.y;
      const dd = Math.hypot(dx, dy);
      if (dd < 150) target = (1 - dd / 150) * 0.3 * (dx >= 0 ? 1 : -1);
    }
    v.lean += (target - v.lean) * Math.min(1, dt * 5);
  }

  function drawBud(g, fl, swell, peek, fold) {
    const a = 1 - clamp(fold * 2.2 - 0.15, 0, 1);
    if (a <= 0 || swell <= 0) return;
    const s = fl.size * (0.30 + 0.42 * smooth(swell));
    g.save();
    g.globalAlpha = a;
    // colour of the coming petals peeking from the crown
    if (peek > 0) {
      g.fillStyle = fl.budCol;
      g.beginPath();
      g.ellipse(0, -s * 0.55, s * 0.34 * peek, s * 0.42 * peek, 0, 0, TAU);
      g.fill();
    }
    // sepal shell folding open as the petals push out
    for (let i = 0; i < 4; i++) {
      const spread = (i - 1.5) * (0.34 + fold * 0.9);
      g.save();
      g.translate(0, s * 0.35);
      g.rotate(spread);
      g.fillStyle = i % 2 === 0 ? fl.stemCol : hsl(108, 44, 33);
      g.beginPath();
      g.moveTo(0, 0);
      g.quadraticCurveTo(-s * 0.30, -s * 0.55, 0, -s * (1.05 - fold * 0.25));
      g.quadraticCurveTo(s * 0.30, -s * 0.55, 0, 0);
      g.fill();
      g.restore();
    }
    g.restore();
  }

  function drawVine(v, t) {
    if (animT < v.delay) return;
    const { pts, fl } = v;
    const endD = v.progress;

    // stem: the traversed part of the path, two-tone for a lit edge
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    let i = 1;
    ctx.strokeStyle = fl.stemCol;
    ctx.lineWidth = v.lw;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (; i < pts.length && pts[i].d <= endD; i++) ctx.lineTo(pts[i].x, pts[i].y);
    const tip = pointAtD(pts, endD, v.cursor);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();
    ctx.strokeStyle = fl.stemHi;
    ctx.lineWidth = v.lw * 0.35;
    ctx.beginPath();
    ctx.moveTo(pts[0].x - v.lw * 0.2, pts[0].y);
    for (let j = 1; j < i; j++) ctx.lineTo(pts[j].x - v.lw * 0.2, pts[j].y);
    ctx.lineTo(tip.x - v.lw * 0.2, tip.y);
    ctx.stroke();

    // leaves unfold as the tip passes them, rippling as gusts pass
    const leafSway = reducedMotion ? 0 : Math.sin(t * 1.0 + v.swayPhase) * 0.06;
    for (const lf of v.leaves) {
      if (lf.d > endD) break;
      const grow = smooth(clamp((endD - lf.d) / 60, 0, 1));
      if (grow <= 0.02) continue;
      drawLeaf(ctx, { ang: lf.ang, col: lf.col }, lf.x, lf.y, lf.len * grow, leafSway + gustAt(lf.x) * 0.6);
    }

    if (!v.arrived) {
      // growing tip: a pale young curl
      ctx.fillStyle = hsl(95, 50, 46);
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, v.lw * 0.9, 0, TAU);
      ctx.fill();
      return;
    }

    // the flower at the anchor, following the marigold life cycle
    const ts = animT - v.arriveT;
    const swell = clamp(ts / 1.4, 0, 1);
    const peek = clamp((ts - 1.0) / 0.8, 0, 1);
    const bloom = fl.bloomAmount();
    const nod = reducedMotion ? 0 : Math.sin(t * 0.6 + v.swayPhase) * 0.03;
    const bobX = reducedMotion ? 0 : Math.sin(t * 0.7 + v.swayPhase) * 2;
    const gw = gustAt(tip.x); // the breeze bends the bloom as it passes

    ctx.save();
    ctx.translate(tip.x + bobX + v.lean * -9 + gw * 26, tip.y);
    ctx.rotate(v.headAng + fl.tiltA + nod + v.lean + gw * 1.1);
    drawCalyx(ctx, fl, 0.4 + 0.6 * swell);
    drawHeadCore(ctx, fl, t);
    drawBud(ctx, fl, swell, peek, bloom);
    ctx.restore();
  }

  // ---------------------------------------------------------------
  // Breeze: every so often a gust sweeps across, and the flowers
  // ripple in sequence as the front passes them
  // ---------------------------------------------------------------
  function gustAt(x) {
    if (!gust.active) return 0;
    const frontX = gust.startX + gust.dir * gust.speed * (animT - gust.t0);
    const dx = (x - frontX) / gust.width;
    return gust.amp * Math.exp(-dx * dx) * gust.dir;
  }

  function updateGust(dt) {
    if (reducedMotion) return;
    if (gust.active) {
      const travelled = gust.speed * (animT - gust.t0);
      if (travelled > W + gust.width * 4) {
        gust.active = false;
        gust.next = animT + rand(14, 26);
      }
    } else if (animT > gust.next) {
      gust.active = true;
      gust.t0 = animT;
      gust.dir = Math.random() < 0.5 ? 1 : -1;
      gust.width = rand(180, 260);
      gust.startX = gust.dir > 0 ? -gust.width * 2 : W + gust.width * 2;
      gust.speed = rand(300, 420);
      gust.amp = rand(0.12, 0.22);
    }
  }

  // ---------------------------------------------------------------
  // Butterflies: flutter between blooms, land, rest, move on
  // ---------------------------------------------------------------
  const BFLY_PALETTES = [
    { wing: [30, 92, 60], edge: [18, 75, 32], spot: "rgba(255,244,220,0.85)" },  // monarch orange
    { wing: [272, 48, 72], edge: [265, 40, 40], spot: "rgba(255,255,255,0.8)" }, // lavender
  ];

  function seedButterflies() {
    butterflies.length = 0;
    for (let i = 0; i < 2; i++) {
      butterflies.push({
        x: rand(0, W), y: rand(H * 0.2, H * 0.6),
        heading: rand(0, TAU),
        speed: rand(90, 130),
        state: "fly",
        target: null,
        perchT: 0,
        flap: rand(0, TAU),
        size: rand(10, 13),
        pal: BFLY_PALETTES[i % BFLY_PALETTES.length],
        wobble: rand(0, TAU),
        lastVine: null,
      });
    }
  }

  function pickButterflyTarget(b) {
    const settled = vines.filter(v => v.arrived && v.fl.bloomAmount() > 0.9 && v !== b.lastVine);
    if (settled.length && Math.random() < 0.75) {
      const v = settled[Math.floor(rand(0, settled.length))];
      const tip = v.pts[v.pts.length - 1];
      b.target = { x: tip.x, y: tip.y - v.fl.size * 0.3, perch: true, vine: v };
    } else {
      b.target = { x: rand(W * 0.1, W * 0.9), y: rand(H * 0.1, H * 0.7), perch: false };
    }
  }

  function updateButterfly(b, dt, t) {
    if (reducedMotion) { b.flap += dt * 2; return; }
    if (b.state === "fly") {
      b.flap += dt * 22;
      if (!b.target) pickButterflyTarget(b);
      const dx = b.target.x - b.x, dy = b.target.y - b.y;
      const dist = Math.hypot(dx, dy);
      const want = Math.atan2(dy, dx);
      let diff = want - b.heading;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      b.heading += clamp(diff, -2.4 * dt, 2.4 * dt) + Math.sin(t * 3.1 + b.wobble) * 0.9 * dt;
      const sp = b.speed * clamp(dist / 90, 0.35, 1); // ease in on approach
      b.x += Math.cos(b.heading) * sp * dt;
      b.y += Math.sin(b.heading) * sp * dt + Math.sin(t * 7 + b.wobble) * 14 * dt;
      if (dist < 9) {
        if (b.target.perch) {
          b.state = "perch";
          b.perchT = rand(2.5, 6);
          b.lastVine = b.target.vine;
          b.x = b.target.x; b.y = b.target.y;
        } else {
          b.target = null;
        }
      }
    } else {
      b.flap += dt * 2.6; // slow open-close while resting
      b.perchT -= dt;
      if (b.perchT <= 0 || Math.abs(gustAt(b.x)) > 0.12) {
        b.state = "fly";
        b.target = null;
        b.heading = rand(0, TAU);
      }
    }
  }

  function drawButterfly(b, t) {
    const s = b.size;
    const flying = b.state === "fly";
    const open = flying
      ? 0.25 + 0.75 * Math.abs(Math.sin(b.flap))
      : 0.55 + 0.4 * (Math.sin(b.flap) + 1) / 2;
    const [wh, ws, wl] = b.pal.wing;
    const [eh, es, el] = b.pal.edge;

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(flying ? b.heading + Math.PI / 2 : Math.sin(t * 0.8 + b.wobble) * 0.08);

    for (const side of [-1, 1]) {
      ctx.save();
      ctx.scale(side * open, 1);
      // upper wing
      let grad = ctx.createLinearGradient(0, 0, s * 1.2, -s);
      grad.addColorStop(0, hsl(eh, es, el));
      grad.addColorStop(0.35, hsl(wh, ws, wl));
      grad.addColorStop(1, hsl(wh, ws, wl + 10));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.1);
      ctx.bezierCurveTo(s * 0.9, -s * 1.3, s * 1.5, -s * 0.7, s * 1.15, -s * 0.05);
      ctx.bezierCurveTo(s * 0.8, s * 0.25, s * 0.2, s * 0.1, 0, -s * 0.1);
      ctx.fill();
      ctx.strokeStyle = hsl(eh, es, el, 0.8);
      ctx.lineWidth = 0.8;
      ctx.stroke();
      // lower wing
      grad = ctx.createLinearGradient(0, 0, s * 0.8, s * 0.9);
      grad.addColorStop(0, hsl(eh, es, el));
      grad.addColorStop(1, hsl(wh, ws, wl - 5));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, s * 0.05);
      ctx.bezierCurveTo(s * 0.75, s * 0.15, s * 0.85, s * 0.95, s * 0.25, s * 0.9);
      ctx.bezierCurveTo(s * 0.05, s * 0.85, 0, s * 0.4, 0, s * 0.05);
      ctx.fill();
      ctx.stroke();
      // wing spot
      ctx.fillStyle = b.pal.spot;
      ctx.beginPath();
      ctx.ellipse(s * 0.72, -s * 0.55, s * 0.14, s * 0.09, -0.5, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    // body + antennae
    ctx.fillStyle = "#2e1a12";
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.11, s * 0.52, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = "#2e1a12";
    ctx.lineWidth = 0.7;
    for (const sd of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.45);
      ctx.quadraticCurveTo(sd * s * 0.25, -s * 0.85, sd * s * 0.38, -s * 0.78);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------
  // A few small blossoms drifting across the scene
  // ---------------------------------------------------------------
  function seedTumblers() {
    tumblers.length = 0;
    const n = 5;
    for (let i = 0; i < n; i++) {
      const type = Math.random() < 0.6 ? "cosmos" : "aster";
      const spec = SPECIES[type];
      const fl = baseFlower(type, rand(14, 22));
      fl.age = 10;
      tumblers.push({
        fl,
        x: rand(0, W), y: rand(H * 0.08, H * 0.7),
        vx: rand(10, 26) * (Math.random() < 0.5 ? -1 : 1),
        vy: rand(-5, 5),
        rot: rand(0, TAU),
        rotV: rand(0.15, 0.4) * (Math.random() < 0.5 ? -1 : 1),
        bob: rand(0, TAU),
      });
    }
  }

  function drawTumblers(dt, t) {
    for (const tb of tumblers) {
      tb.x += tb.vx * dt * (reducedMotion ? 0.2 : 1);
      tb.y += (tb.vy + Math.sin(t * 0.6 + tb.bob) * 8) * dt * (reducedMotion ? 0.2 : 1);
      tb.rot += tb.rotV * dt * (reducedMotion ? 0.2 : 1);
      const m = tb.fl.size * 2;
      if (tb.x < -m) tb.x = W + m;
      if (tb.x > W + m) tb.x = -m;
      if (tb.y < -m) tb.y = H * 0.7;
      if (tb.y > H * 0.85) tb.y = -m;
      ctx.save();
      ctx.translate(tb.x, tb.y);
      ctx.rotate(tb.rot);
      ctx.scale(0.9, 0.9);
      drawHeadCore(ctx, tb.fl, t);
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------
  // Atmosphere
  // ---------------------------------------------------------------
  function seedBokeh() {
    bokehs.length = 0;
    for (let i = 0; i < 14; i++) {
      bokehs.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(50, 170),
        hue: Math.random() < 0.55 ? rand(20, 45) : rand(330, 355),
        alpha: rand(0.04, 0.09),
        vx: rand(-4, 4), vy: rand(-4, -1),
      });
    }
  }

  function seedMotes() {
    for (let i = 0; i < 14; i++) {
      motes.push({
        x: rand(0, W), y: rand(0, H),
        phase: rand(0, TAU), speed: rand(0.5, 1.4),
        dx: rand(0, TAU), dy: rand(0, TAU),
      });
    }
  }

  function spawnHeart() {
    hearts.push({
      x: rand(W * 0.1, W * 0.9), y: H + 15,
      vy: rand(18, 34), sway: rand(0, TAU),
      s: rand(5, 11), alpha: rand(0.35, 0.6),
      hue: rand(335, 355),
    });
  }

  function heartPath(g, s) {
    const k = s / 95;
    g.beginPath();
    g.moveTo(0, (40 - 70) * k);
    g.bezierCurveTo(0, (37 - 70) * k, -5 * k, (25 - 70) * k, -25 * k, (25 - 70) * k);
    g.bezierCurveTo(-55 * k, (25 - 70) * k, -55 * k, (62.5 - 70) * k, -55 * k, (62.5 - 70) * k);
    g.bezierCurveTo(-55 * k, (80 - 70) * k, -35 * k, (102 - 70) * k, 0, (120 - 70) * k);
    g.bezierCurveTo(35 * k, (102 - 70) * k, 55 * k, (80 - 70) * k, 55 * k, (62.5 - 70) * k);
    g.bezierCurveTo(55 * k, (62.5 - 70) * k, 55 * k, (25 - 70) * k, 25 * k, (25 - 70) * k);
    g.bezierCurveTo(10 * k, (25 - 70) * k, 0, (37 - 70) * k, 0, (40 - 70) * k);
    g.closePath();
  }

  function spawnDriftPetal() {
    driftPetals.push({
      x: rand(0, W), y: -20,
      vx: rand(-12, 12), vy: rand(18, 45),
      rot: rand(0, TAU), rotV: rand(-1.5, 1.5),
      size: rand(4, 9),
      hue: Math.random() < 0.55 ? rand(22, 40) : rand(335, 355),
      alpha: rand(0.35, 0.7),
    });
  }

  // a settled bloom lets go of one of its own petals
  function spawnBloomPetal(x, y, hue) {
    driftPetals.push({
      x: x + rand(-6, 6), y,
      vx: rand(-16, 16) + gustAt(x) * 120,
      vy: rand(12, 30),
      rot: rand(0, TAU), rotV: rand(-2, 2),
      size: rand(3.5, 7),
      hue: hue + rand(-6, 6),
      alpha: rand(0.5, 0.85),
    });
  }

  function spawnSparkle(x, y) {
    sparkles.push({
      x, y,
      vx: rand(-25, 25), vy: rand(-25, 25),
      life: 1, decay: rand(1.2, 2.4),
      size: rand(1, 2.6),
    });
  }

  // ---------------------------------------------------------------
  // Background: romantic dusk
  // ---------------------------------------------------------------
  function drawBackground(dt) {
    let g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#33182b");
    g.addColorStop(0.45, "#271424");
    g.addColorStop(0.8, "#1b0e1a");
    g.addColorStop(1, "#120a12");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const b of bokehs) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -b.r) b.x = W + b.r; if (b.x > W + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = H + b.r;
      const bg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      bg.addColorStop(0, hsl(b.hue, 65, 60, b.alpha));
      bg.addColorStop(1, hsl(b.hue, 65, 60, 0));
      ctx.fillStyle = bg;
      ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }

    // soft grounding at the very bottom edge
    const mound = ctx.createLinearGradient(0, H * 0.88, 0, H);
    mound.addColorStop(0, "rgba(16,6,14,0)");
    mound.addColorStop(1, "rgba(12,4,10,0.55)");
    ctx.fillStyle = mound;
    ctx.fillRect(0, H * 0.88, W, H * 0.12);
  }

  function drawHalo(alpha) {
    if (alpha <= 0) return;
    const glow = ctx.createRadialGradient(CX, CY, 0, CX, CY, clearRadius * 1.9);
    glow.addColorStop(0, "rgba(255,165,90,0.16)");
    glow.addColorStop(1, "rgba(255,165,90,0)");
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawMotes(t) {
    for (const f of motes) {
      const x = f.x + Math.sin(t * 0.31 * f.speed + f.dx) * 60;
      const y = f.y + Math.sin(t * 0.23 * f.speed + f.dy) * 45;
      const pulse = 0.25 + 0.75 * Math.pow(Math.abs(Math.sin(t * f.speed + f.phase)), 2);
      const r = 5 + pulse * 5;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(255,238,180,${0.5 * pulse})`);
      g.addColorStop(0.3, `rgba(255,215,140,${0.22 * pulse})`);
      g.addColorStop(1, "rgba(255,215,140,0)");
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.fillStyle = `rgba(255,250,225,${0.85 * pulse})`;
      ctx.beginPath();
      ctx.arc(x, y, 1.1, 0, TAU);
      ctx.fill();
    }
  }

  // ---------------------------------------------------------------
  // Film timeline & camera
  //   0–3 fade in · 3–8 follow the sprouting hero vine · 8–15 wide climb
  //   15–21 slow-motion bloom close-up · 21–27 the garden opens
  //   27–30 the name reveals · then a living hold with replay
  // ---------------------------------------------------------------
  function timeScaleNow() {
    if (reducedMotion) return 1;
    if (movieT >= 16 && movieT < 20.5) return 0.45; // slow-motion unfurl
    return 1;
  }

  function nameAlphaNow() {
    if (reducedMotion) return 1;
    return smooth(clamp((movieT - 27) / 2.6, 0, 1));
  }

  function cameraGoal() {
    if (reducedMotion || movieT >= 21 || !heroVine) return { x: CX, y: CY, z: 1 };
    if (movieT < 3) {
      return { x: heroVine.pts[0].x, y: H * 0.86, z: 1.7 };
    }
    if (movieT < 8) { // ride along with the growing tip
      const tip = pointAtD(heroVine.pts, heroVine.progress, {});
      return { x: tip.x, y: tip.y - 14, z: 2.1 };
    }
    if (movieT < 15) return { x: CX, y: CY + H * 0.05, z: 1.04 };
    // push in on the hero bud for the bloom
    const tip = heroVine.pts[heroVine.pts.length - 1];
    return { x: tip.x, y: tip.y, z: 2.4 };
  }

  function updateCamera(dt) {
    const g = cameraGoal();
    const kp = 1 - Math.pow(0.16, dt);
    const kz = 1 - Math.pow(0.30, dt);
    cam.x += (g.x - cam.x) * kp;
    cam.y += (g.y - cam.y) * kp;
    cam.z += (g.z - cam.z) * kz;
  }

  // ---------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------
  let last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;
    movieT += dt;
    const wdt = dt * timeScaleNow();
    animT += wdt;
    const nA = nameAlphaNow();

    drawBackground(dt);

    updateGust(wdt);
    for (const v of vines) updateVine(v, wdt);

    // settled blooms occasionally shed a petal (more in a gust)
    if (!reducedMotion && animT > 19 && driftPetals.length < 40) {
      for (const v of vines) {
        if (!v.arrived || v.fl.age < v.fl.bloomDur + 2) continue;
        const chance = wdt * (0.025 + Math.abs(gustAt(v.pts[v.pts.length - 1].x)) * 0.8);
        if (Math.random() < chance) {
          const tip = v.pts[v.pts.length - 1];
          spawnBloomPetal(tip.x, tip.y, v.fl.petalHue);
        }
      }
    }

    updateCamera(dt);

    // ---- everything below lives in the camera's world ----
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(cam.z, cam.z);
    ctx.translate(-cam.x, -cam.y);

    // behind the name: back vines first, then drifting blossoms sunk in haze
    for (const v of vines) if (!v.front) drawVine(v, t);
    if (animT > 21) drawTumblers(wdt, t);
    drawHalo(nA);
    drawName(t, nA);
    for (const v of vines) if (v.front) drawVine(v, t);

    if (animT > 19.5) {
      for (const b of butterflies) {
        updateButterfly(b, wdt, t);
        drawButterfly(b, t);
      }
    }

    // floating hearts (once the garden has opened)
    if (!reducedMotion && animT > 24 && Math.random() < wdt * 0.9 && hearts.length < 14) spawnHeart();
    for (let i = hearts.length - 1; i >= 0; i--) {
      const hh = hearts[i];
      hh.y -= hh.vy * wdt;
      hh.x += Math.sin(t * 1.1 + hh.sway) * 14 * wdt;
      const fade = clamp((hh.y - H * 0.18) / (H * 0.25), 0, 1);
      if (hh.y < H * 0.12) { hearts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(hh.x, hh.y);
      ctx.rotate(Math.sin(t * 0.9 + hh.sway) * 0.18);
      ctx.globalAlpha = hh.alpha * fade;
      ctx.fillStyle = hsl(hh.hue, 75, 68);
      heartPath(ctx, hh.s);
      ctx.fill();
      ctx.globalAlpha = hh.alpha * fade * 0.5;
      ctx.strokeStyle = hsl(hh.hue, 85, 82);
      ctx.lineWidth = 0.8;
      ctx.stroke();
      ctx.restore();
    }

    // falling petals (once blooms exist to shed them)
    if (!reducedMotion && animT > 19 && Math.random() < wdt * 1.2 && driftPetals.length < 30) spawnDriftPetal();
    for (let i = driftPetals.length - 1; i >= 0; i--) {
      const p = driftPetals[i];
      p.x += (p.vx + Math.sin(t + p.rot) * 8) * wdt;
      p.y += p.vy * wdt;
      p.rot += p.rotV * wdt;
      if (p.y > H + 30) { driftPetals.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot + Math.sin(t * 2 + p.rot) * 0.4);
      ctx.globalAlpha = p.alpha;
      const s = p.size;
      const pg = ctx.createLinearGradient(-s, 0, s, 0);
      pg.addColorStop(0, hsl(p.hue - 8, 78, 45));
      pg.addColorStop(1, hsl(p.hue + 6, 86, 62));
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.moveTo(-s, 0);
      ctx.quadraticCurveTo(0, -s * 0.7, s, 0);
      ctx.quadraticCurveTo(0, s * 0.45, -s, 0);
      ctx.fill();
      ctx.restore();
    }

    drawMotes(t);

    ctx.restore();
    // ---- back to screen space ----

    // cinematic letterbox: bars slide in for the film, out for the hold
    if (!reducedMotion) {
      const bar = H * 0.085 * smooth(clamp(movieT / 1.4, 0, 1)) *
        (1 - smooth(clamp((movieT - 30.5) / 1.8, 0, 1)));
      if (bar > 0.5) {
        ctx.fillStyle = "#050208";
        ctx.fillRect(0, 0, W, bar);
        ctx.fillRect(0, H - bar, W, bar);
      }
      // fade in from black
      const fade = 1 - smooth(clamp(movieT / 2.4, 0, 1));
      if (fade > 0) {
        ctx.fillStyle = `rgba(3,1,5,${fade})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    if (!iconsShown && movieT > 31) {
      iconsShown = true;
      document.getElementById("film-replay").classList.add("show");
      document.getElementById("film-home").classList.add("show");
    }

    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------
  // Controls: replay, and back to the interactive bouquet
  // ---------------------------------------------------------------
  document.getElementById("film-replay").addEventListener("click", () => location.reload());
  document.getElementById("film-home").href = "./" + location.search;
  window.addEventListener("resize", resize);

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  resize();
  seedMotes();
  seedButterflies();
  // drifting extras enter from the wings rather than popping mid-frame
  for (const tb of tumblers) tb.x = Math.random() < 0.5 ? -tb.fl.size * 2 : W + tb.fl.size * 2;
  for (const b of butterflies) { b.x = Math.random() < 0.5 ? -40 : W + 40; b.y = rand(H * 0.15, H * 0.5); }
  if (reducedMotion) movieT = 40; // skip straight to the settled garden
  const g0 = cameraGoal();
  cam.x = g0.x; cam.y = g0.y; cam.z = g0.z;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
