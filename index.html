<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary — Garden of Marigolds</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0c1a12;
  }

  #garden {
    position: fixed;
    inset: 0;
    display: block;
    cursor: crosshair;
  }

  #name {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: bold;
    font-size: clamp(4rem, 14vw, 11rem);
    letter-spacing: 0.04em;
    color: #ffe9b8;
    text-shadow:
      0 0 12px rgba(255, 200, 90, 0.9),
      0 0 34px rgba(255, 160, 40, 0.65),
      0 0 80px rgba(255, 120, 20, 0.45),
      0 2px 6px rgba(0, 0, 0, 0.6);
    user-select: none;
    pointer-events: none;
    animation: shimmer 4.5s ease-in-out infinite;
    z-index: 2;
    white-space: nowrap;
  }

  @keyframes shimmer {
    0%, 100% {
      text-shadow:
        0 0 12px rgba(255, 200, 90, 0.9),
        0 0 34px rgba(255, 160, 40, 0.65),
        0 0 80px rgba(255, 120, 20, 0.45),
        0 2px 6px rgba(0, 0, 0, 0.6);
      transform: translate(-50%, -50%) scale(1);
    }
    50% {
      text-shadow:
        0 0 18px rgba(255, 215, 120, 1),
        0 0 48px rgba(255, 175, 60, 0.8),
        0 0 110px rgba(255, 135, 30, 0.55),
        0 2px 6px rgba(0, 0, 0, 0.6);
      transform: translate(-50%, -50%) scale(1.025);
    }
  }

  #hint {
    position: fixed;
    bottom: 1.2rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 0.95rem;
    color: rgba(255, 233, 184, 0.55);
    z-index: 2;
    pointer-events: none;
    animation: fadehint 2s ease 6s forwards;
    text-align: center;
  }

  @keyframes fadehint { to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    #name { animation: none; }
  }
</style>
</head>
<body>
<canvas id="garden"></canvas>
<div id="name">Mary</div>
<div id="hint">move your mouse through the garden &middot; click anywhere to plant a bloom</div>

<script>
(function () {
  "use strict";

  const canvas = ctxCanvas();
  const ctx = canvas.getContext("2d");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;

  let W = 0, H = 0, CX = 0, CY = 0, DPR = 1;
  let clearRadius = 0;   // keep-out zone around the name

  const mouse = { x: -9999, y: -9999, active: false };
  const flowers = [];
  const sparkles = [];
  const driftPetals = [];

  function ctxCanvas() { return document.getElementById("garden"); }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H / 2;
    const nameEl = document.getElementById("name");
    const rect = nameEl.getBoundingClientRect();
    clearRadius = Math.max(rect.width, rect.height) * 0.62;
  }

  // ---------------------------------------------------------------
  // Color palettes per flower type
  // ---------------------------------------------------------------
  const TYPES = {
    marigold: {
      weight: 0.62,
      petals: [
        ["#b34700", "#e06810"],  // outer ring: deep orange
        ["#e07510", "#ff9820"],  // mid ring: amber
        ["#ff9d1e", "#ffc23a"],  // inner ring: golden
      ],
      center: "#7a3c00",
      centerDot: "#5c2c00",
      size: [26, 46],
      ruffle: true,
    },
    cosmos: {
      weight: 0.22,
      petals: [
        ["#d4548a", "#f08bb4"],  // pink
      ],
      center: "#ffd23e",
      centerDot: "#e0a010",
      size: [20, 34],
      ruffle: false,
    },
    aster: {
      weight: 0.16,
      petals: [
        ["#6a4fb0", "#9b7fe0"],  // purple
      ],
      center: "#ffcf40",
      centerDot: "#d09010",
      size: [14, 26],
      ruffle: false,
    },
  };

  function pickType() {
    let r = Math.random();
    for (const key of Object.keys(TYPES)) {
      r -= TYPES[key].weight;
      if (r <= 0) return key;
    }
    return "marigold";
  }

  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------------------------------------------------------------
  // Flower: orbits the center, blooms, sways, fades, restarts
  // ---------------------------------------------------------------
  class Flower {
    constructor(opts) {
      this.reset(opts || {});
    }

    reset(opts) {
      this.type = opts.type || pickType();
      const spec = TYPES[this.type];
      this.size = rand(spec.size[0], spec.size[1]);

      if (opts.x !== undefined) {
        // planted at a specific spot (click) — derive orbit from it
        const dx = opts.x - CX, dy = opts.y - CY;
        this.angle = Math.atan2(dy, dx);
        this.radius = Math.max(clearRadius + this.size, Math.hypot(dx, dy));
      } else {
        this.angle = rand(0, TAU);
        const maxR = Math.hypot(CX, CY) * 0.95;
        this.radius = rand(clearRadius + this.size, maxR);
      }

      // orbital motion: inner flowers swirl faster, like water around a stone
      const dir = Math.random() < 0.5 ? 1 : -1;
      this.baseSpeed = dir * rand(0.05, 0.16) * (260 / (this.radius + 140));
      this.radialDrift = rand(-4, 4);          // slow spiral in/out, px per second
      this.eccentric = rand(0.85, 1.15);       // squash the orbit into an ellipse
      this.wobblePhase = rand(0, TAU);
      this.wobbleSpeed = rand(0.4, 1.1);

      // life cycle (seconds): bloom -> hold -> fade
      this.bloomDur = rand(2.2, 4.5);
      this.holdDur = rand(7, 16);
      this.fadeDur = rand(2, 3.5);
      this.age = opts.staggered ? rand(0, this.bloomDur + this.holdDur) : 0;

      this.spin = rand(0, TAU);
      this.spinSpeed = rand(-0.25, 0.25);
      this.swayPhase = rand(0, TAU);

      // cursor influence offset (spring back to 0)
      this.ox = 0;
      this.oy = 0;
    }

    get lifetime() { return this.bloomDur + this.holdDur + this.fadeDur; }

    // 0..1 bloom progress with easing, then 1, then back toward 0 while fading
    bloomAmount() {
      if (this.age < this.bloomDur) {
        const t = this.age / this.bloomDur;
        return 1 - Math.pow(1 - t, 3); // ease-out cubic: petals unfurl fast then settle
      }
      return 1;
    }

    alpha() {
      const fadeStart = this.bloomDur + this.holdDur;
      if (this.age > fadeStart) {
        return Math.max(0, 1 - (this.age - fadeStart) / this.fadeDur);
      }
      return 1;
    }

    update(dt, t) {
      this.age += dt;
      if (this.age > this.lifetime) {
        this.reset({});
        return;
      }

      const speedScale = reducedMotion ? 0.25 : 1;
      this.angle += this.baseSpeed * dt * speedScale;
      this.radius += this.radialDrift * dt * speedScale;

      // keep flowers on screen and out of the name's clear zone
      const maxR = Math.hypot(CX, CY) * 0.98;
      const minR = clearRadius + this.size * 0.8;
      if (this.radius < minR) { this.radius = minR; this.radialDrift = Math.abs(this.radialDrift); }
      if (this.radius > maxR) { this.radius = maxR; this.radialDrift = -Math.abs(this.radialDrift); }

      this.spin += this.spinSpeed * dt * speedScale;

      // breathing wobble on the orbit radius
      const wobble = Math.sin(t * this.wobbleSpeed + this.wobblePhase) * 10;
      this.x = CX + Math.cos(this.angle) * (this.radius + wobble) * this.eccentric;
      this.y = CY + Math.sin(this.angle) * (this.radius + wobble) / this.eccentric;

      // gentle push away from the cursor, with springy recovery
      if (mouse.active && !reducedMotion) {
        const dx = this.x - mouse.x, dy = this.y - mouse.y;
        const d = Math.hypot(dx, dy);
        const reach = 160;
        if (d < reach && d > 0.001) {
          const force = (1 - d / reach) * 90 * dt;
          this.ox += (dx / d) * force;
          this.oy += (dy / d) * force;
        }
      }
      this.ox *= Math.pow(0.12, dt); // spring back
      this.oy *= Math.pow(0.12, dt);
      this.x += this.ox;
      this.y += this.oy;
    }

    draw(t) {
      const bloom = this.bloomAmount();
      const a = this.alpha();
      if (a <= 0) return;

      const spec = TYPES[this.type];
      const sway = reducedMotion ? 0 : Math.sin(t * 0.9 + this.swayPhase) * 0.06;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.spin + sway);
      ctx.globalAlpha = a;

      const rings = spec.petals.length;
      for (let ring = 0; ring < rings; ring++) {
        // outer rings unfurl first; inner rings follow
        const ringDelay = ring / (rings + 1);
        const ringBloom = Math.min(1, Math.max(0, (bloom - ringDelay) / (1 - ringDelay)));
        if (ringBloom <= 0) continue;

        const ringScale = (1 - ring * 0.28) * ringBloom;
        const petalLen = this.size * ringScale;
        const petalCount = spec.ruffle ? 12 - ring * 2 : 8;
        const [edge, fill] = spec.petals[ring];

        for (let i = 0; i < petalCount; i++) {
          const pa = (i / petalCount) * TAU + ring * 0.35;
          drawPetal(petalLen, pa, fill, edge, spec.ruffle, ringBloom);
        }
      }

      // flower center appears as the bloom opens
      const centerR = this.size * 0.22 * Math.min(1, bloom * 1.6);
      if (centerR > 0.5) {
        ctx.beginPath();
        ctx.arc(0, 0, centerR, 0, TAU);
        ctx.fillStyle = spec.center;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, centerR * 0.55, 0, TAU);
        ctx.fillStyle = spec.centerDot;
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // one petal as a bezier leaf shape pointing along angle `pa`
  function drawPetal(len, pa, fill, edge, ruffle, open) {
    ctx.save();
    ctx.rotate(pa);
    // unopened petals stand more upright (narrow), opening widens them
    const width = len * (ruffle ? 0.42 : 0.34) * (0.4 + 0.6 * open);
    const inner = len * 0.15;

    ctx.beginPath();
    ctx.moveTo(inner, 0);
    if (ruffle) {
      // marigold: ruffled tip made of two bumps
      ctx.bezierCurveTo(inner + len * 0.3, -width, len * 0.82, -width * 0.9, len * 0.96, -width * 0.25);
      ctx.quadraticCurveTo(len * 1.04, 0, len * 0.96, width * 0.25);
      ctx.bezierCurveTo(len * 0.82, width * 0.9, inner + len * 0.3, width, inner, 0);
    } else {
      // smooth daisy-like petal
      ctx.bezierCurveTo(inner + len * 0.25, -width, len, -width * 0.5, len, 0);
      ctx.bezierCurveTo(len, width * 0.5, inner + len * 0.25, width, inner, 0);
    }
    ctx.closePath();

    const grad = ctx.createLinearGradient(inner, 0, len, 0);
    grad.addColorStop(0, edge);
    grad.addColorStop(1, fill);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = 0.6;
    ctx.stroke();
    ctx.restore();
  }

  // ---------------------------------------------------------------
  // Ambient drifting petals & cursor sparkles
  // ---------------------------------------------------------------
  function spawnDriftPetal() {
    driftPetals.push({
      x: rand(0, W), y: -20,
      vx: rand(-12, 12), vy: rand(18, 45),
      rot: rand(0, TAU), rotV: rand(-1.5, 1.5),
      size: rand(3, 7),
      color: Math.random() < 0.7 ? "#ff9820" : "#f08bb4",
      alpha: rand(0.35, 0.75),
    });
  }

  function spawnSparkle(x, y) {
    sparkles.push({
      x, y,
      vx: rand(-25, 25), vy: rand(-25, 25),
      life: 1, decay: rand(1.2, 2.4),
      size: rand(1, 2.6),
    });
  }

  // ---------------------------------------------------------------
  // Background: soft night-garden gradient with a warm glow center
  // ---------------------------------------------------------------
  function drawBackground() {
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.hypot(CX, CY));
    g.addColorStop(0, "#1c3322");
    g.addColorStop(0.5, "#12241a");
    g.addColorStop(1, "#08120c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(CX, CY, 0, CX, CY, clearRadius * 1.6);
    glow.addColorStop(0, "rgba(255,170,60,0.10)");
    glow.addColorStop(1, "rgba(255,170,60,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }

  // ---------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------
  let last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;

    drawBackground();

    // ambient petals
    if (!reducedMotion && Math.random() < dt * 2 && driftPetals.length < 40) spawnDriftPetal();
    for (let i = driftPetals.length - 1; i >= 0; i--) {
      const p = driftPetals[i];
      p.x += (p.vx + Math.sin(t + p.rot) * 8) * dt;
      p.y += p.vy * dt;
      p.rot += p.rotV * dt;
      if (p.y > H + 30) { driftPetals.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    // flowers — draw farther-out flowers first for soft layering
    for (const f of flowers) f.update(dt, t);
    flowers.sort((a, b) => b.radius - a.radius);
    for (const f of flowers) f.draw(t);

    // sparkles
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.life -= s.decay * dt;
      if (s.life <= 0) { sparkles.splice(i, 1); continue; }
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      ctx.globalAlpha = s.life;
      ctx.fillStyle = "#ffe9b8";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * s.life, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------
  // Interaction
  // ---------------------------------------------------------------
  function pointerMove(x, y) {
    mouse.x = x;
    mouse.y = y;
    mouse.active = true;
    if (!reducedMotion && Math.random() < 0.5) spawnSparkle(x, y);
  }

  function plantFlower(x, y) {
    // never plant on top of the name
    if (Math.hypot(x - CX, y - CY) < clearRadius) return;
    const f = new Flower({ x, y });
    flowers.push(f);
    for (let i = 0; i < 8; i++) spawnSparkle(x, y);
    // keep population in check: retire the oldest extras
    const cap = flowerTarget() + 25;
    while (flowers.length > cap) flowers.shift();
  }

  window.addEventListener("mousemove", (e) => pointerMove(e.clientX, e.clientY));
  window.addEventListener("mouseleave", () => { mouse.active = false; });
  window.addEventListener("click", (e) => plantFlower(e.clientX, e.clientY));
  window.addEventListener("touchmove", (e) => {
    const t0 = e.touches[0];
    if (t0) pointerMove(t0.clientX, t0.clientY);
  }, { passive: true });
  window.addEventListener("touchstart", (e) => {
    const t0 = e.touches[0];
    if (t0) plantFlower(t0.clientX, t0.clientY);
  }, { passive: true });
  window.addEventListener("resize", resize);

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  function flowerTarget() {
    const area = W * H;
    return Math.max(18, Math.min(55, Math.round(area / 26000)));
  }

  resize();
  const n = flowerTarget();
  for (let i = 0; i < n; i++) flowers.push(new Flower({ staggered: true }));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
