<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bouquet for Mary</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1c0f18;
  }

  #garden {
    position: fixed;
    inset: 0;
    display: block;
    cursor: crosshair;
  }

</style>
</head>
<body>
<canvas id="garden"></canvas>

<script>
(function () {
  "use strict";

  // ----- personalization: ?name=Sofia -----
  const params = new URLSearchParams(location.search);
  const NAME = (params.get("name") || "Mary").slice(0, 24);
  document.title = "A Bouquet for " + NAME;

  const canvas = document.getElementById("garden");
  const ctx = canvas.getContext("2d");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const GOLDEN = 2.399963; // golden angle, for floret spirals

  let W = 0, H = 0, CX = 0, CY = 0, DPR = 1;
  let clearRadius = 120;    // half-width of the name, for the swirl funnel
  let vignette = null;
  let nameSprite = null;

  const mouse = { x: -9999, y: -9999, active: false };
  const risers = [];       // flowers ascending in the helix
  const bed = [];          // the lush bed along the bottom
  const sparkles = [];
  const driftPetals = [];
  const hearts = [];
  const motes = [];        // firefly glow motes
  const bokehs = [];

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const hsl = (h, s, l, a = 1) => `hsla(${h.toFixed(1)},${s.toFixed(1)}%,${l.toFixed(1)}%,${a})`;

  // ---------------------------------------------------------------
  // The name, pre-rendered with its glow so flowers can swirl both
  // behind and in front of it
  // ---------------------------------------------------------------
  function renderName() {
    const fontSize = clamp(W * 0.125, 52, 165);
    const font = `italic bold ${fontSize}px Georgia, "Palatino Linotype", serif`;
    ctx.font = font;
    const textW = ctx.measureText(NAME).width;
    clearRadius = textW * 0.5 + fontSize * 0.15;

    const pad = fontSize * 0.6;
    const c = document.createElement("canvas");
    const lw = textW + pad * 2;
    const lh = fontSize * 1.35 + pad * 2;
    c.width = Math.ceil(lw * DPR);
    c.height = Math.ceil(lh * DPR);
    const g = c.getContext("2d");
    g.scale(DPR, DPR);
    g.textAlign = "center";
    g.textBaseline = "middle";

    const nx = lw / 2, ny = pad + fontSize * 0.62;

    // halo passes
    g.font = font;
    g.shadowColor = "rgba(255,170,90,0.85)";
    g.shadowBlur = fontSize * 0.28;
    g.fillStyle = "rgba(255,214,150,0.9)";
    g.fillText(NAME, nx, ny);
    g.shadowBlur = fontSize * 0.10;
    g.fillText(NAME, nx, ny);
    g.shadowBlur = 0;

    // gradient gold face
    const grad = g.createLinearGradient(0, ny - fontSize * 0.55, 0, ny + fontSize * 0.55);
    grad.addColorStop(0, "#fffbe9");
    grad.addColorStop(0.35, "#ffe9b0");
    grad.addColorStop(0.62, "#ffcb72");
    grad.addColorStop(1, "#e08a3c");
    g.fillStyle = grad;
    g.fillText(NAME, nx, ny);

    nameSprite = { canvas: c, w: lw, h: lh, ox: nx, oy: ny };
  }

  function drawName(t) {
    if (!nameSprite) return;
    const s = nameSprite;
    const pulse = reducedMotion ? 0 : (Math.sin(t * 1.2) + 1) / 2;
    const scale = 1 + pulse * 0.012;
    ctx.save();
    ctx.translate(CX, CY);
    ctx.scale(scale, scale);
    ctx.drawImage(s.canvas, -s.ox, -s.oy, s.w, s.h);
    if (pulse > 0) { // soft breathing of the glow
      ctx.globalAlpha = pulse * 0.28;
      ctx.globalCompositeOperation = "lighter";
      ctx.drawImage(s.canvas, -s.ox, -s.oy, s.w, s.h);
    }
    ctx.restore();
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H * 0.46;

    vignette = ctx.createRadialGradient(CX, CY, Math.min(W, H) * 0.44, CX, CY, Math.hypot(CX, CY) * 1.08);
    vignette.addColorStop(0, "rgba(0,0,0,0)");
    vignette.addColorStop(1, "rgba(10,2,8,0.52)");

    renderName();
    seedBokeh();
    seedBed();
  }

  // ---------------------------------------------------------------
  // Flower species
  // ---------------------------------------------------------------
  const SPECIES = {
    marigold: { weight: 0.34, size: [26, 44] },
    rose:     { weight: 0.30, size: [26, 42] },
    cosmos:   { weight: 0.20, size: [22, 34] },
    aster:    { weight: 0.16, size: [17, 27] },
  };

  function pickSpecies() {
    let r = Math.random();
    for (const key of Object.keys(SPECIES)) {
      r -= SPECIES[key].weight;
      if (r <= 0) return key;
    }
    return "marigold";
  }

  // ---------------------------------------------------------------
  // Petal geometry (each drawn pointing along +x, base at origin)
  // ---------------------------------------------------------------
  function marigoldPetalPath(g, L, w) {
    const r0 = L * 0.10;
    g.beginPath();
    g.moveTo(r0, 0);
    g.bezierCurveTo(L * 0.30, -w * 0.9, L * 0.62, -w, L * 0.80, -w * 0.70);
    g.quadraticCurveTo(L * 1.03, -w * 0.48, L * 0.93, -w * 0.22);
    g.quadraticCurveTo(L * 1.07, 0, L * 0.93, w * 0.22);
    g.quadraticCurveTo(L * 1.03, w * 0.48, L * 0.80, w * 0.70);
    g.bezierCurveTo(L * 0.62, w, L * 0.30, w * 0.9, r0, 0);
    g.closePath();
  }

  function rosePetalPath(g, L, w) {
    const r0 = L * 0.08;
    g.beginPath();
    g.moveTo(r0, 0);
    g.bezierCurveTo(L * 0.22, -w * 0.95, L * 0.70, -w * 1.02, L * 0.92, -w * 0.45);
    g.quadraticCurveTo(L * 1.05, 0, L * 0.92, w * 0.45);
    g.bezierCurveTo(L * 0.70, w * 1.02, L * 0.22, w * 0.95, r0, 0);
    g.closePath();
  }

  function cosmosPetalPath(g, L, w) {
    const r0 = L * 0.08;
    g.beginPath();
    g.moveTo(r0, 0);
    g.bezierCurveTo(L * 0.25, -w * 0.75, L * 0.72, -w, L * 0.90, -w * 0.55);
    g.quadraticCurveTo(L * 1.0, -w * 0.38, L * 0.99, -w * 0.30);
    g.lineTo(L * 0.92, -w * 0.16);
    g.lineTo(L * 1.02, -w * 0.04);
    g.lineTo(L * 0.93, w * 0.10);
    g.lineTo(L * 1.0, w * 0.26);
    g.quadraticCurveTo(L * 0.97, w * 0.40, L * 0.90, w * 0.55);
    g.bezierCurveTo(L * 0.72, w, L * 0.25, w * 0.75, r0, 0);
    g.closePath();
  }

  function asterPetalPath(g, L, w) {
    const r0 = L * 0.12;
    g.beginPath();
    g.moveTo(r0, 0);
    g.bezierCurveTo(L * 0.38, -w, L * 0.88, -w * 0.85, L, 0);
    g.bezierCurveTo(L * 0.88, w * 0.85, L * 0.38, w, r0, 0);
    g.closePath();
  }

  // ---------------------------------------------------------------
  // Sprite pre-rendering
  // ---------------------------------------------------------------
  const SS = 2;

  function makeSprite(size) {
    const pad = 1.3;
    const logical = size * 2 * pad;
    const c = document.createElement("canvas");
    c.width = c.height = Math.max(8, Math.ceil(logical * SS));
    const g = c.getContext("2d");
    g.scale(SS, SS);
    g.translate(logical / 2, logical / 2);
    return { canvas: c, logical, g };
  }

  function bakeShading(sp, R) {
    const g = sp.g;
    g.save();
    g.globalCompositeOperation = "source-atop";
    let grad = g.createRadialGradient(-R * 0.4, -R * 0.4, 0, -R * 0.4, -R * 0.4, R * 1.7);
    grad.addColorStop(0, "rgba(255,255,240,0.18)");
    grad.addColorStop(1, "rgba(255,255,240,0)");
    g.fillStyle = grad;
    g.fillRect(-R * 1.4, -R * 1.4, R * 2.8, R * 2.8);
    grad = g.createRadialGradient(R * 0.55, R * 0.55, 0, R * 0.55, R * 0.55, R * 1.6);
    grad.addColorStop(0, "rgba(40,5,20,0.20)");
    grad.addColorStop(1, "rgba(40,5,20,0)");
    g.fillStyle = grad;
    g.fillRect(-R * 1.4, -R * 1.4, R * 2.8, R * 2.8);
    g.restore();
  }

  function petalRing(sp, opts) {
    const g = sp.g;
    const { count, R, width, path, base, mid, tip, angleOffset, veins, rim } = opts;
    g.save();
    g.shadowColor = "rgba(35,5,15,0.55)";
    g.shadowBlur = R * 0.17;
    g.shadowOffsetY = R * 0.06 * SS;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * TAU + angleOffset + rand(-0.05, 0.05);
      const L = R * rand(0.92, 1.08);
      const w = width * rand(0.88, 1.1);
      // each petal catches light a little differently
      const jh = rand(-2.5, 2.5), jl = rand(-4, 4);
      g.save();
      g.rotate(a);
      path(g, L, w);
      // cupped shading: dark base, bright belly, slightly dimmer tip
      const grad = g.createLinearGradient(0, 0, L, 0);
      grad.addColorStop(0, hsl(base[0] + jh, base[1], base[2] + jl * 0.6));
      grad.addColorStop(0.55, hsl(mid[0] + jh, mid[1], mid[2] + jl));
      grad.addColorStop(1, hsl(tip[0] + jh, tip[1], tip[2] + jl));
      g.fillStyle = grad;
      g.fill();
      if (rim) { // petal edge catching the light
        g.strokeStyle = rim;
        g.lineWidth = 0.9;
        g.stroke();
      }
      g.strokeStyle = "rgba(60,10,25,0.10)";
      g.lineWidth = 0.7;
      g.beginPath();
      g.moveTo(L * 0.15, 0);
      g.quadraticCurveTo(L * 0.6, rand(-1, 1), L * 0.92, 0);
      g.stroke();
      if (veins) {
        g.strokeStyle = "rgba(80,20,40,0.10)";
        g.lineWidth = 0.6;
        for (const vy of [-0.3, 0.3]) {
          g.beginPath();
          g.moveTo(L * 0.15, 0);
          g.quadraticCurveTo(L * 0.55, w * vy * 1.1, L * 0.85, w * vy);
          g.stroke();
        }
      }
      g.restore();
    }
    g.restore();
  }

  function floretDisk(sp, R, dark, light) {
    const g = sp.g;
    const n = Math.max(14, Math.round(R * R * 0.55));
    const c = R / Math.sqrt(n);
    for (let i = 0; i < n; i++) {
      const r = c * Math.sqrt(i);
      const a = i * GOLDEN;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      const dotR = R * rand(0.10, 0.15) * (1 - r / (R * 2.4));
      const grad = g.createRadialGradient(x - dotR * 0.4, y - dotR * 0.4, 0, x, y, dotR);
      grad.addColorStop(0, light);
      grad.addColorStop(1, dark);
      g.fillStyle = grad;
      g.beginPath();
      g.arc(x, y, dotR, 0, TAU);
      g.fill();
    }
  }

  // tight spiral of curved petals — the heart of a rose
  function roseCore(sp, R, h) {
    const g = sp.g;
    g.save();
    g.lineCap = "round";
    let a0 = rand(0, TAU);
    for (let k = 0; k < 7; k++) {
      const rr = R * (1 - k * 0.13);
      const light = k % 2 === 0;
      g.strokeStyle = hsl(h + (light ? 4 : -6), light ? 62 : 58, light ? 58 : 40);
      g.lineWidth = rr * 0.5;
      g.beginPath();
      g.arc(Math.cos(a0) * R * 0.08, Math.sin(a0) * R * 0.08, rr, a0, a0 + 3.6);
      g.stroke();
      a0 += 2.3;
    }
    g.fillStyle = hsl(h - 10, 55, 30);
    g.beginPath();
    g.arc(0, 0, R * 0.16, 0, TAU);
    g.fill();
    g.restore();
  }

  // soft dark pool under the flower's eye, so the middle reads as recessed
  function centerAO(sp, R) {
    const g = sp.g;
    const grad = g.createRadialGradient(0, 0, 0, 0, 0, R * 1.25);
    grad.addColorStop(0, "rgba(30,5,15,0.42)");
    grad.addColorStop(1, "rgba(30,5,15,0)");
    g.fillStyle = grad;
    g.fillRect(-R * 1.25, -R * 1.25, R * 2.5, R * 2.5);
  }

  function buildSprites(type, size, hueJit) {
    const layers = [];
    let center = null;

    if (type === "marigold") {
      const h = 27 + hueJit;
      const nLayers = 5;
      for (let li = 0; li < nLayers; li++) {
        const f = li / (nLayers - 1);
        const R = size * (1 - li * 0.165);
        const sp = makeSprite(R);
        petalRing(sp, {
          count: Math.max(8, Math.round(14 - li * 1.6)),
          R,
          width: R * 0.34,
          path: marigoldPetalPath,
          base: [h - 14 + f * 6, 88, 30 + f * 9],
          mid: [h + f * 16, 96, 50 + f * 12],
          tip: [h + f * 12, 90, 44 + f * 11],
          angleOffset: li * 0.42,
          rim: hsl(h + 18, 95, 72, 0.3),
        });
        bakeShading(sp, R);
        layers.push(sp);
      }
      center = makeSprite(size * 0.20);
      centerAO(center, size * 0.17);
      floretDisk(center, size * 0.14, hsl(h - 12, 80, 22), hsl(h - 4, 85, 40));
    } else if (type === "rose") {
      // some blush pink, some deep red
      const h = (Math.random() < 0.55 ? 344 : 355) + hueJit;
      const deep = h > 350;
      const nLayers = 5;
      for (let li = 0; li < nLayers; li++) {
        const f = li / (nLayers - 1);
        const R = size * (1 - li * 0.17);
        const sp = makeSprite(R);
        petalRing(sp, {
          count: Math.max(6, Math.round(10 - li * 1.2)),
          R,
          width: R * 0.42,
          path: rosePetalPath,
          base: [h - 6, deep ? 68 : 58, (deep ? 26 : 40) + f * 7],
          mid: [h, deep ? 74 : 66, (deep ? 44 : 62) + f * 9],
          tip: [h + 5, deep ? 70 : 62, (deep ? 38 : 56) + f * 9],
          angleOffset: li * 0.5 + 0.2,
          rim: hsl(h + 8, 80, deep ? 62 : 80, 0.35),
        });
        bakeShading(sp, R);
        layers.push(sp);
      }
      center = makeSprite(size * 0.34);
      centerAO(center, size * 0.28);
      roseCore(center, size * 0.26, h);
    } else if (type === "cosmos") {
      const h = 330 + hueJit * 1.5;
      for (const [scale, dl] of [[0.94, -14], [1, 0]]) {
        const R = size * scale;
        const sp = makeSprite(R);
        petalRing(sp, {
          count: 8,
          R,
          width: R * 0.30,
          path: cosmosPetalPath,
          base: [h, 62, 54 + dl],
          mid: [h + 4, 74, 78 + dl * 0.6],
          tip: [h + 4, 68, 72 + dl * 0.6],
          angleOffset: scale < 1 ? TAU / 16 : 0,
          veins: true,
          rim: hsl(h + 10, 80, 88, 0.35),
        });
        bakeShading(sp, R);
        layers.push(sp);
      }
      center = makeSprite(size * 0.28);
      centerAO(center, size * 0.23);
      floretDisk(center, size * 0.20, hsl(38, 95, 42), hsl(48, 100, 62));
    } else { // aster
      const h = 262 + hueJit * 1.8;
      for (const [scale, dl] of [[1, -10], [0.82, 0]]) {
        const R = size * scale;
        const sp = makeSprite(R);
        petalRing(sp, {
          count: 18,
          R,
          width: R * 0.10,
          path: asterPetalPath,
          base: [h - 6, 48, 48 + dl],
          mid: [h + 6, 62, 72 + dl * 0.6],
          tip: [h + 6, 56, 66 + dl * 0.6],
          angleOffset: scale < 1 ? TAU / 36 : 0,
          rim: hsl(h + 12, 70, 85, 0.3),
        });
        bakeShading(sp, R);
        layers.push(sp);
      }
      center = makeSprite(size * 0.30);
      centerAO(center, size * 0.25);
      floretDisk(center, size * 0.22, hsl(40, 92, 40), hsl(50, 100, 60));
    }

    const shadow = makeSprite(size);
    const sg = shadow.g;
    const grad = sg.createRadialGradient(0, 0, 0, 0, 0, size);
    grad.addColorStop(0, "rgba(0,0,0,0.40)");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    sg.fillStyle = grad;
    sg.beginPath();
    sg.arc(0, 0, size, 0, TAU);
    sg.fill();

    return { layers, center, shadow };
  }

  // ---------------------------------------------------------------
  // Stem, leaves, calyx — drawn as light vectors every frame so the
  // flowers stand on real stems instead of floating in space
  // ---------------------------------------------------------------
  function bezPoint(p0, p1, p2, p3, u) {
    const v = 1 - u;
    return {
      x: v * v * v * p0.x + 3 * v * v * u * p1.x + 3 * v * u * u * p2.x + u * u * u * p3.x,
      y: v * v * v * p0.y + 3 * v * v * u * p1.y + 3 * v * u * u * p2.y + u * u * u * p3.y,
    };
  }

  function drawLeaf(g, lf, x, y, len, sway) {
    g.save();
    g.translate(x, y);
    g.rotate(lf.ang + sway);
    g.fillStyle = lf.col;
    g.beginPath();
    g.moveTo(0, 0);
    g.quadraticCurveTo(len * 0.5, -len * 0.34, len, -len * 0.06);
    g.quadraticCurveTo(len * 0.5, len * 0.24, 0, 0);
    g.fill();
    g.strokeStyle = "rgba(15,45,18,0.4)";
    g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(len * 0.06, -len * 0.01);
    g.quadraticCurveTo(len * 0.5, -len * 0.10, len * 0.92, -len * 0.05);
    g.stroke();
    g.restore();
  }

  function drawStem(g, fl, t, bloom) {
    const s = fl.size;
    const len = fl.stemLen * (0.4 + 0.6 * Math.min(1, bloom * 1.3));
    const sway = reducedMotion ? 0 : Math.sin(t * 0.8 + fl.swayPhase) * s * 0.16;
    const bend = fl.stemBend + sway;
    const p0 = { x: 0, y: s * 0.30 };
    const p1 = { x: bend * 0.4, y: len * 0.35 };
    const p2 = { x: bend * 0.9, y: len * 0.72 };
    const p3 = { x: bend * 1.3, y: len };
    const lw = Math.max(1.6, s * 0.075);

    g.lineCap = "round";
    g.strokeStyle = fl.stemCol;
    g.lineWidth = lw;
    g.beginPath();
    g.moveTo(p0.x, p0.y);
    g.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
    g.stroke();
    // thin lit edge makes the stem read as a cylinder
    g.strokeStyle = fl.stemHi;
    g.lineWidth = lw * 0.4;
    g.beginPath();
    g.moveTo(p0.x - lw * 0.22, p0.y);
    g.bezierCurveTo(p1.x - lw * 0.22, p1.y, p2.x - lw * 0.22, p2.y, p3.x - lw * 0.22, p3.y);
    g.stroke();

    const leafSway = reducedMotion ? 0 : Math.sin(t * 1.1 + fl.swayPhase) * 0.09;
    for (const lf of fl.leaves) {
      if (lf.u * fl.stemLen > len) continue; // still furled while the stem grows
      const p = bezPoint(p0, p1, p2, p3, lf.u);
      drawLeaf(g, lf, p.x, p.y, s * lf.len, leafSway * lf.side);
    }

    // calyx: sepals hugging the base of the head
    for (const a of fl.sepals) {
      g.save();
      g.translate(a.x * s, s * 0.42);
      g.rotate(a.ang);
      g.fillStyle = fl.stemCol;
      g.beginPath();
      g.moveTo(-s * 0.08, 0);
      g.quadraticCurveTo(a.curl * s, s * 0.30, 0, s * 0.52);
      g.quadraticCurveTo(-s * 0.14, s * 0.28, -s * 0.08, 0);
      g.fill();
      g.restore();
    }
  }

  // ---------------------------------------------------------------
  // Flower drawing: stem + tilted, bowl-shaped head with per-layer
  // parallax. Always drawn OPAQUE here; drawFlower() composites the
  // whole flower through a scratch canvas when it must be translucent,
  // so petals and neighbours never show through each other (no x-ray).
  // ---------------------------------------------------------------
  function drawFlowerInto(g, fl, t, scale) {
    const bloom = fl.bloomAmount();
    if (bloom <= 0) return;
    const { layers, center, shadow } = fl.sprites;

    const sway = reducedMotion ? 0 : Math.sin(t * 0.85 + fl.swayPhase) * 0.04;
    const nod = reducedMotion ? 0 : Math.sin(t * 0.7 + fl.breathPhase) * 0.04;
    const breath = reducedMotion ? 1 : 1 + Math.sin(t * 1.2 + fl.breathPhase) * 0.015;
    // tilt direction drifts slowly; inner (higher) layers shift with it
    const tiltX = reducedMotion ? 0.35 : Math.sin(t * 0.5 + fl.swayPhase) * 0.5 + 0.15;
    const tiltY = reducedMotion ? 0.5 : Math.cos(t * 0.42 + fl.breathPhase) * 0.35 + 0.55;

    g.save();
    g.scale(scale, scale);

    if (fl.hasShadow) { // grounded flowers cast a pool of shade
      g.globalAlpha = 0.5 * bloom;
      const shDim = shadow.logical * 1.05;
      g.drawImage(shadow.canvas, -shDim / 2 + fl.size * 0.10, -shDim / 2 + fl.size * 0.22, shDim, shDim);
      g.globalAlpha = 1;
    }

    g.rotate(fl.tiltA + nod); // the whole flower nods on its stem

    drawStem(g, fl, t, bloom);

    const n = layers.length;
    for (let li = 0; li < n; li++) {
      const delay = li / (n + 1);
      const lb = clamp((bloom - delay) / (1 - delay), 0, 1);
      if (lb <= 0) continue;
      const eased = 1 - Math.pow(1 - lb, 2);
      const s = (0.15 + 0.85 * eased) * breath;
      const lift = li * fl.size * 0.065; // how far this layer rises off the disc
      // outer layers squash more than inner: the head is a bowl, not a disc
      const sq = fl.squash * (0.92 + 0.10 * (n === 1 ? 1 : li / (n - 1)));

      const sp = layers[li];
      g.save();
      g.translate(-tiltX * lift, -tiltY * lift);
      g.scale(1, sq);
      g.rotate(fl.spin + sway + (1 - eased) * 0.9);
      g.scale(s, s);
      g.drawImage(sp.canvas, -sp.logical / 2, -sp.logical / 2, sp.logical, sp.logical);
      g.restore();
    }

    const cb = Math.min(1, bloom * 1.5);
    if (cb > 0.05) {
      const lift = n * fl.size * 0.065;
      g.save();
      g.translate(-tiltX * lift, -tiltY * lift);
      g.scale(1, fl.squash * 1.04);
      g.rotate(fl.spin * 0.3);
      g.scale(cb * breath, cb * breath);
      g.drawImage(center.canvas, -center.logical / 2, -center.logical / 2, center.logical, center.logical);
      g.restore();
    }

    g.restore();
  }

  const scratch = document.createElement("canvas");
  const scratchG = scratch.getContext("2d");

  function drawFlower(fl, t, x, y, scale, alpha) {
    if (alpha <= 0.01) return;
    if (alpha > 0.985) {
      ctx.save();
      ctx.translate(x, y);
      drawFlowerInto(ctx, fl, t, scale);
      ctx.restore();
      return;
    }
    // translucent: render the whole flower opaque offscreen, blit once
    const s = fl.size * scale;
    const hw = Math.ceil(s * 1.8);
    const top = Math.ceil(s * 1.7);
    const w = hw * 2;
    const h = Math.ceil(top + fl.stemLen * scale + s);
    if (scratch.width < w * DPR) scratch.width = Math.ceil(w * DPR);
    if (scratch.height < h * DPR) scratch.height = Math.ceil(h * DPR);
    scratchG.setTransform(1, 0, 0, 1, 0, 0);
    scratchG.clearRect(0, 0, scratch.width, scratch.height);
    scratchG.setTransform(DPR, 0, 0, DPR, 0, 0);
    scratchG.translate(hw, top);
    drawFlowerInto(scratchG, fl, t, scale);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(scratch, 0, 0, w * DPR, h * DPR, x - hw, y - top, w, h);
    ctx.restore();
  }

  let flowerId = 0;

  function baseFlower(type, size) {
    const stemHue = rand(98, 118);
    const leaves = [];
    for (const side of [1, -1]) {
      if (Math.random() < 0.85) {
        leaves.push({
          u: side > 0 ? rand(0.35, 0.52) : rand(0.6, 0.8),
          ang: side > 0 ? -rand(0.25, 0.65) : Math.PI + rand(0.25, 0.65),
          len: rand(0.5, 0.8),
          side,
          col: hsl(stemHue + rand(-6, 6), rand(40, 52), rand(26, 36)),
        });
      }
    }
    const sepals = [
      { x: -0.16, ang: 0.55, curl: 0.10 },
      { x: 0, ang: 0, curl: 0.12 },
      { x: 0.16, ang: -0.55, curl: 0.10 },
    ];
    return {
      type, size,
      id: flowerId++,
      sprites: buildSprites(type, size, rand(-7, 7)),
      spin: rand(0, TAU),
      spinSpeed: rand(-0.05, 0.05),
      swayPhase: rand(0, TAU),
      breathPhase: rand(0, TAU),
      squash: rand(0.86, 0.95),
      tiltA: rand(-0.12, 0.12),
      stemLen: size * 2.6,      // callers override
      stemBend: rand(-0.30, 0.30) * size,
      stemCol: hsl(stemHue, 46, 27),
      stemHi: hsl(stemHue - 5, 42, 40, 0.75),
      leaves,
      sepals,
      hasShadow: false,
      bloomDur: rand(2.4, 4.2),
      age: 0,
      bloomAmount() {
        const p = clamp(this.age / this.bloomDur, 0, 1);
        return 1 - Math.pow(1 - p, 3);
      },
    };
  }

  // ---------------------------------------------------------------
  // Risers: bud at the bottom, spiral up around the name.
  // x = CX + cos(theta)·Rx(y), depth z = sin(theta) — a true helix,
  // so flowers pass behind and in front of the name.
  // ---------------------------------------------------------------
  function funnelRadius(y, fl) {
    const dyn = clamp(Math.abs(y - CY) / (H * 0.52), 0, 1);
    const inner = clearRadius * 1.10 + fl.size * 0.7;
    const outer = W * 0.48 * fl.spread;
    return inner + Math.max(0, outer - inner) * Math.pow(dyn, 0.9);
  }

  function makeRiser(opts = {}) {
    const type = opts.type || pickSpecies();
    const spec = SPECIES[type];
    const fl = baseFlower(type, rand(spec.size[0], spec.size[1]));
    fl.spread = rand(0.5, 1.0);
    fl.stemLen = fl.size * rand(2.2, 3.2);
    fl.theta = rand(0, TAU);
    fl.omega = rand(0.28, 0.6) * (reducedMotion ? 0.3 : 1);
    fl.vy = rand(20, 42) * (reducedMotion ? 0.3 : 1);
    fl.y = H + rand(20, 140);
    fl.ox = 0; fl.oy = 0;
    fl.z = Math.sin(fl.theta);
    fl.yDraw = fl.y;

    if (opts.x !== undefined) {
      fl.y = opts.y;
      const c = clamp((opts.x - CX) / funnelRadius(opts.y, fl), -1, 1);
      fl.theta = Math.acos(c) * (Math.random() < 0.5 ? 1 : -1);
    } else if (opts.staggered) {
      fl.y = rand(-20, H + 60);
      if (fl.y < H * 0.92) fl.age = fl.bloomDur; // already open mid-flight
    }
    return fl;
  }

  function updateRiser(fl, dt, t) {
    fl.age += dt;
    fl.theta += fl.omega * dt;
    fl.y -= fl.vy * dt;
    fl.spin += fl.spinSpeed * dt * (reducedMotion ? 0.3 : 1);

    if (fl.y < -fl.size * 2) Object.assign(fl, makeRiser({ type: fl.type }));

    const rx = funnelRadius(fl.y, fl);
    fl.z = Math.sin(fl.theta);
    fl.x = CX + Math.cos(fl.theta) * rx;
    // the swirl ring is tilted toward the viewer: flowers ride lower when
    // in front, higher when behind — like looking down onto the orbit
    fl.yDraw = fl.y + fl.z * clamp(clearRadius * 0.20, 26, 64);
    // springy push from the cursor
    if (mouse.active && !reducedMotion) {
      const dx = fl.x - mouse.x, dy = fl.yDraw - mouse.y;
      const d = Math.hypot(dx, dy);
      if (d < 150 && d > 0.001) {
        const force = (1 - d / 150) * 85 * dt;
        fl.ox += (dx / d) * force;
        fl.oy += (dy / d) * force;
      }
    }
    fl.ox *= Math.pow(0.12, dt);
    fl.oy *= Math.pow(0.12, dt);
  }

  function riserAlphaScale(fl) {
    const depth = (fl.z + 1) / 2;                       // 0 back … 1 front
    const persp = 0.78 + 0.5 * clamp(fl.y / H, 0, 1);   // lower = closer
    const scale = (0.60 + 0.58 * depth) * persp;
    let alpha = 1; // opaque by default — depth comes from scale and the halo
    const fadeBand = H * 0.14;
    if (fl.yDraw < fadeBand) alpha *= clamp(fl.yDraw / fadeBand, 0, 1);
    // go ghostly while crossing in front of the name so it stays readable
    if (fl.z > 0) {
      const inX = clamp(1 - Math.abs(fl.x - CX) / clearRadius, 0, 1);
      const inY = clamp(1 - Math.abs(fl.yDraw - CY) / (clearRadius * 0.6), 0, 1);
      alpha *= 1 - 0.62 * Math.sin(inX * Math.PI / 2) * Math.sin(inY * Math.PI / 2);
    }
    return { scale, alpha };
  }

  // ---------------------------------------------------------------
  // The flower bed: a dense, lush row anchoring the bottom edge
  // ---------------------------------------------------------------
  function seedBed() {
    bed.length = 0;
    const rows = [
      { y0: 0.885, y1: 0.915, sMul: [0.9, 1.2], gap: 72, dim: 0.6 },  // far row
      { y0: 0.925, y1: 0.965, sMul: [1.15, 1.5], gap: 62, dim: 0.8 }, // middle row
      { y0: 0.975, y1: 1.02, sMul: [1.45, 1.9], gap: 55, dim: 1 },    // front row
    ];
    for (const row of rows) {
      const n = Math.ceil(W / row.gap) + 1;
      for (let i = 0; i <= n; i++) {
        const type = pickSpecies();
        const spec = SPECIES[type];
        const fl = baseFlower(type, rand(spec.size[0], spec.size[1]) * rand(row.sMul[0], row.sMul[1]));
        fl.x = (i / n) * W + rand(-25, 25);
        fl.y = H * rand(row.y0, row.y1);
        fl.squash = rand(0.72, 0.82); // seen more from the side
        fl.dim = row.dim;
        fl.stemLen = fl.size * rand(1.1, 1.6); // short stems into the soil
        fl.hasShadow = true;
        fl.bloomDur = rand(1.8, 3.4);
        fl.age = rand(-0.8, 0.4); // bloom in a quick wave on load
        fl.spinSpeed = rand(-0.02, 0.02);
        bed.push(fl);
      }
    }
  }

  // ---------------------------------------------------------------
  // Atmosphere
  // ---------------------------------------------------------------
  function seedBokeh() {
    bokehs.length = 0;
    for (let i = 0; i < 14; i++) {
      bokehs.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(50, 170),
        hue: Math.random() < 0.55 ? rand(20, 45) : rand(330, 355),
        alpha: rand(0.04, 0.09),
        vx: rand(-4, 4), vy: rand(-4, -1),
      });
    }
  }

  function seedMotes() {
    for (let i = 0; i < 14; i++) {
      motes.push({
        x: rand(0, W), y: rand(0, H),
        phase: rand(0, TAU), speed: rand(0.5, 1.4),
        dx: rand(0, TAU), dy: rand(0, TAU),
      });
    }
  }

  function spawnHeart() {
    hearts.push({
      x: rand(W * 0.1, W * 0.9), y: H + 15,
      vy: rand(18, 34), sway: rand(0, TAU),
      s: rand(5, 11), alpha: rand(0.35, 0.6),
      hue: rand(335, 355),
    });
  }

  function heartPath(g, s) {
    // normalized classic heart, centered, height ≈ s
    const k = s / 95;
    g.beginPath();
    g.moveTo(0, (40 - 70) * k);
    g.bezierCurveTo(0 * k, (37 - 70) * k, -5 * k, (25 - 70) * k, -25 * k, (25 - 70) * k);
    g.bezierCurveTo(-55 * k, (25 - 70) * k, -55 * k, (62.5 - 70) * k, -55 * k, (62.5 - 70) * k);
    g.bezierCurveTo(-55 * k, (80 - 70) * k, -35 * k, (102 - 70) * k, 0, (120 - 70) * k);
    g.bezierCurveTo(35 * k, (102 - 70) * k, 55 * k, (80 - 70) * k, 55 * k, (62.5 - 70) * k);
    g.bezierCurveTo(55 * k, (62.5 - 70) * k, 55 * k, (25 - 70) * k, 25 * k, (25 - 70) * k);
    g.bezierCurveTo(10 * k, (25 - 70) * k, 0, (37 - 70) * k, 0, (40 - 70) * k);
    g.closePath();
  }

  function spawnDriftPetal() {
    driftPetals.push({
      x: rand(0, W), y: -20,
      vx: rand(-12, 12), vy: rand(18, 45),
      rot: rand(0, TAU), rotV: rand(-1.5, 1.5),
      size: rand(4, 9),
      hue: Math.random() < 0.55 ? rand(22, 40) : rand(335, 355),
      alpha: rand(0.35, 0.7),
    });
  }

  function spawnSparkle(x, y) {
    sparkles.push({
      x, y,
      vx: rand(-25, 25), vy: rand(-25, 25),
      life: 1, decay: rand(1.2, 2.4),
      size: rand(1, 2.6),
    });
  }

  // ---------------------------------------------------------------
  // Background: romantic dusk
  // ---------------------------------------------------------------
  function drawBackground(dt) {
    let g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#33182b");
    g.addColorStop(0.45, "#271424");
    g.addColorStop(0.8, "#1b0e1a");
    g.addColorStop(1, "#120a12");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (const b of bokehs) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -b.r) b.x = W + b.r; if (b.x > W + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = H + b.r;
      const bg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      bg.addColorStop(0, hsl(b.hue, 65, 60, b.alpha));
      bg.addColorStop(1, hsl(b.hue, 65, 60, 0));
      ctx.fillStyle = bg;
      ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }

    // dark garden mound grounding the bed
    const mound = ctx.createLinearGradient(0, H * 0.78, 0, H);
    mound.addColorStop(0, "rgba(16,6,14,0)");
    mound.addColorStop(1, "rgba(12,4,10,0.9)");
    ctx.fillStyle = mound;
    ctx.fillRect(0, H * 0.78, W, H * 0.22);
  }

  // warm halo behind the name — drawn over the far flowers, so depth
  // reads as atmosphere: the farther a flower, the more it sinks into glow
  function drawHalo() {
    const glow = ctx.createRadialGradient(CX, CY, 0, CX, CY, clearRadius * 1.9);
    glow.addColorStop(0, "rgba(255,165,90,0.16)");
    glow.addColorStop(1, "rgba(255,165,90,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }

  function drawMotes(t) {
    for (const f of motes) {
      const x = f.x + Math.sin(t * 0.31 * f.speed + f.dx) * 60;
      const y = f.y + Math.sin(t * 0.23 * f.speed + f.dy) * 45;
      const pulse = 0.25 + 0.75 * Math.pow(Math.abs(Math.sin(t * f.speed + f.phase)), 2);
      const r = 5 + pulse * 5;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(255,238,180,${0.5 * pulse})`);
      g.addColorStop(0.3, `rgba(255,215,140,${0.22 * pulse})`);
      g.addColorStop(1, "rgba(255,215,140,0)");
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.fillStyle = `rgba(255,250,225,${0.85 * pulse})`;
      ctx.beginPath();
      ctx.arc(x, y, 1.1, 0, TAU);
      ctx.fill();
    }
  }

  // ---------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------
  let last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;

    drawBackground(dt);

    // update all risers, then split by depth around the name.
    // quantized depth + id tie-break keeps the paint order stable when two
    // flowers sit at nearly the same depth (no z-fighting flicker)
    for (const fl of risers) updateRiser(fl, dt, t);
    risers.sort((a, b) =>
      (Math.round(a.z * 24) - Math.round(b.z * 24)) || (a.id - b.id));

    for (const fl of risers) {
      if (fl.z >= 0) break;
      const { scale, alpha } = riserAlphaScale(fl);
      drawFlower(fl, t, fl.x + fl.ox, fl.yDraw + fl.oy, scale, alpha);
    }

    drawHalo();
    drawName(t);

    for (const fl of risers) {
      if (fl.z < 0) continue;
      const { scale, alpha } = riserAlphaScale(fl);
      drawFlower(fl, t, fl.x + fl.ox, fl.yDraw + fl.oy, scale, alpha);
    }

    // floating hearts
    if (!reducedMotion && Math.random() < dt * 0.9 && hearts.length < 14) spawnHeart();
    for (let i = hearts.length - 1; i >= 0; i--) {
      const hh = hearts[i];
      hh.y -= hh.vy * dt;
      hh.x += Math.sin(t * 1.1 + hh.sway) * 14 * dt;
      const fade = clamp((hh.y - H * 0.18) / (H * 0.25), 0, 1);
      if (hh.y < H * 0.12) { hearts.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(hh.x, hh.y);
      ctx.rotate(Math.sin(t * 0.9 + hh.sway) * 0.18);
      ctx.globalAlpha = hh.alpha * fade;
      ctx.fillStyle = hsl(hh.hue, 75, 68);
      heartPath(ctx, hh.s);
      ctx.fill();
      ctx.globalAlpha = hh.alpha * fade * 0.5;
      ctx.strokeStyle = hsl(hh.hue, 85, 82);
      ctx.lineWidth = 0.8;
      ctx.stroke();
      ctx.restore();
    }

    // falling petals
    if (!reducedMotion && Math.random() < dt * 1.6 && driftPetals.length < 30) spawnDriftPetal();
    for (let i = driftPetals.length - 1; i >= 0; i--) {
      const p = driftPetals[i];
      p.x += (p.vx + Math.sin(t + p.rot) * 8) * dt;
      p.y += p.vy * dt;
      p.rot += p.rotV * dt;
      if (p.y > H + 30) { driftPetals.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot + Math.sin(t * 2 + p.rot) * 0.4);
      ctx.globalAlpha = p.alpha;
      const s = p.size;
      const pg = ctx.createLinearGradient(-s, 0, s, 0);
      pg.addColorStop(0, hsl(p.hue - 8, 78, 45));
      pg.addColorStop(1, hsl(p.hue + 6, 86, 62));
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.moveTo(-s, 0);
      ctx.quadraticCurveTo(0, -s * 0.7, s, 0);
      ctx.quadraticCurveTo(0, s * 0.45, -s, 0);
      ctx.fill();
      ctx.restore();
    }

    // the bed is nearest the viewer — draw over everything else, opaque
    for (const fl of bed) {
      fl.age += dt;
      fl.spin += fl.spinSpeed * dt;
      drawFlower(fl, t, fl.x, fl.y, fl.dim, 1);
    }

    drawMotes(t);

    // cursor sparkles
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.life -= s.decay * dt;
      if (s.life <= 0) { sparkles.splice(i, 1); continue; }
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      ctx.globalAlpha = s.life;
      ctx.fillStyle = "#ffe3c8";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * s.life, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------
  // Interaction
  // ---------------------------------------------------------------
  function pointerMove(x, y) {
    mouse.x = x;
    mouse.y = y;
    mouse.active = true;
    if (!reducedMotion && Math.random() < 0.5) spawnSparkle(x, y);
  }

  function plantFlower(x, y) {
    risers.push(makeRiser({ x, y }));
    for (let i = 0; i < 8; i++) spawnSparkle(x, y);
    const cap = riserTarget() + 30;
    while (risers.length > cap) risers.shift();
  }

  window.addEventListener("mousemove", (e) => pointerMove(e.clientX, e.clientY));
  window.addEventListener("mouseleave", () => { mouse.active = false; });
  window.addEventListener("click", (e) => plantFlower(e.clientX, e.clientY));
  window.addEventListener("touchmove", (e) => {
    const t0 = e.touches[0];
    if (t0) pointerMove(t0.clientX, t0.clientY);
  }, { passive: true });
  window.addEventListener("touchstart", (e) => {
    const t0 = e.touches[0];
    if (t0) plantFlower(t0.clientX, t0.clientY);
  }, { passive: true });
  window.addEventListener("resize", resize);

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  function riserTarget() {
    return clamp(Math.round((W * H) / 14500), 38, 90);
  }

  resize();
  seedMotes();
  const n = riserTarget();
  for (let i = 0; i < n; i++) risers.push(makeRiser({ staggered: true }));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
